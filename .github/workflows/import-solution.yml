name: ATT Import Solution

on:
  workflow_dispatch:
    inputs:

      buildNumber:
        description: "Build to deploy (example: Build102)"
        required: true
        type: string

      deploymentType:
        description: "Select deployment type"
        required: true
        type: choice
        options:
          - managed
          - unmanaged

      targetEnvironment:
        description: "Select target environment"
        required: true
        type: choice
        options:
          - PROD

permissions:
  contents: read
  actions: read

concurrency:
  group: att-import-${{ inputs.targetEnvironment }}
  cancel-in-progress: false

jobs:

  import-solution:

    runs-on: windows-latest

    steps:

      # ==========================================================
      # 1. CHECKOUT REPOSITORY
      # ==========================================================

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==========================================================
      # 2. DISPLAY DEPLOYMENT INPUTS
      # ==========================================================

      - name: Display Deployment Inputs
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "======================================================"
          Write-Host "ATT IMPORT / DEPLOYMENT PIPELINE"
          Write-Host "======================================================"
          Write-Host "Build              : ${{ inputs.buildNumber }}"
          Write-Host "Deployment Type    : ${{ inputs.deploymentType }}"
          Write-Host "Target Environment : ${{ inputs.targetEnvironment }}"
          Write-Host "======================================================"
          Write-Host ""


      # ==========================================================
      # 3. VALIDATE BUILD NUMBER
      # ==========================================================

      - name: Validate Build Number
        shell: pwsh
        env:
          BUILD_NUMBER: ${{ inputs.buildNumber }}
        run: |

          if ($env:BUILD_NUMBER -notmatch "^Build[0-9]+$") {
              Write-Error "Invalid build number."
              Write-Error "Expected format: Build102"
              exit 1
          }

          Write-Host "Valid build number: $env:BUILD_NUMBER"


      # ==========================================================
      # 4. INSTALL GITHUB CLI
      # ==========================================================
      #
      # GitHub-hosted Windows runners normally include gh CLI.
      # We verify it before using it.
      # ==========================================================

      - name: Verify GitHub CLI
        shell: pwsh
        run: |
          gh --version

          if ($LASTEXITCODE -ne 0) {
              Write-Error "GitHub CLI is not available."
              exit 1
          }


      # ==========================================================
      # 5. AUTOMATICALLY FIND SUCCESSFUL EXPORT RUN
      # ==========================================================
      #
      # This is the important part.
      #
      # User selects:
      #
      #     Build102
      #
      # Pipeline searches GitHub Actions for:
      #
      #     ATT Export Solution
      #
      # with a successful run containing:
      #
      #     powerplatform-solutions-Build102
      #
      # No Run ID needs to be entered manually.
      # ==========================================================

      - name: Find Successful Export Run
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NUMBER: ${{ inputs.buildNumber }}
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "SEARCHING FOR SUCCESSFUL EXPORT BUILD"
          Write-Host "======================================================"
          Write-Host "Requested Build: $env:BUILD_NUMBER"
          Write-Host ""

          $repo = "${{ github.repository }}"

          Write-Host "Repository:"
          Write-Host $repo
          Write-Host ""

          $workflowRunsUrl = `
            "repos/$repo/actions/workflows/export-solution.yml/runs?status=success&per_page=100"

          Write-Host "Getting successful export workflow runs..."

          $runsJson = gh api $workflowRunsUrl

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Unable to retrieve export workflow runs."
              exit 1
          }

          $runs = $runsJson | ConvertFrom-Json

          $matchingRun = $null
          $matchingArtifact = $null

          foreach ($run in $runs.workflow_runs) {

              Write-Host ""
              Write-Host "Checking Export Run:"
              Write-Host "Run ID : $($run.id)"
              Write-Host "Run    : $($run.run_number)"
              Write-Host "SHA    : $($run.head_sha)"
              Write-Host "Date   : $($run.created_at)"

              $artifactUrl = `
                "repos/$repo/actions/runs/$($run.id)/artifacts?per_page=100"

              $artifactsJson = gh api $artifactUrl

              if ($LASTEXITCODE -ne 0) {
                  Write-Warning "Unable to read artifacts for run $($run.id)."
                  continue
              }

              $artifacts = $artifactsJson | ConvertFrom-Json

              $expectedArtifactName = `
                "powerplatform-solutions-$env:BUILD_NUMBER"

              foreach ($artifact in $artifacts.artifacts) {

                  Write-Host "Artifact found: $($artifact.name)"

                  if (
                      $artifact.name -eq $expectedArtifactName `
                      -and $artifact.expired -eq $false
                  ) {

                      $matchingRun = $run
                      $matchingArtifact = $artifact

                      break
                  }
              }

              if ($null -ne $matchingArtifact) {
                  break
              }
          }

          if ($null -eq $matchingRun) {

              Write-Error ""
              Write-Error "======================================================"
              Write-Error "EXPORT BUILD NOT FOUND"
              Write-Error "======================================================"
              Write-Error "Build: $env:BUILD_NUMBER"
              Write-Error ""
              Write-Error "Make sure:"
              Write-Error "1. Export pipeline completed successfully."
              Write-Error "2. The requested build exists."
              Write-Error "3. The artifact has not expired."
              Write-Error ""
              exit 1
          }

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "EXPORT BUILD FOUND"
          Write-Host "======================================================"
          Write-Host "Build       : $env:BUILD_NUMBER"
          Write-Host "Export Run  : $($matchingRun.id)"
          Write-Host "Run Number  : $($matchingRun.run_number)"
          Write-Host "Artifact ID : $($matchingArtifact.id)"
          Write-Host "Artifact    : $($matchingArtifact.name)"
          Write-Host "Created     : $($matchingArtifact.created_at)"
          Write-Host "======================================================"

          "EXPORT_RUN_ID=$($matchingRun.id)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "ARTIFACT_ID=$($matchingArtifact.id)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          "ARTIFACT_NAME=$($matchingArtifact.name)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


      # ==========================================================
      # 6. DOWNLOAD EXPORT ARTIFACT
      # ==========================================================

      - name: Download Export Artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "DOWNLOADING EXPORT ARTIFACT"
          Write-Host "======================================================"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "./deployment-artifact" |
            Out-Null

          $repo = "${{ github.repository }}"

          $downloadUrl = `
            "repos/$repo/actions/artifacts/$env:ARTIFACT_ID/zip"

          Write-Host "Artifact:"
          Write-Host $env:ARTIFACT_NAME
          Write-Host ""

          gh api `
            $downloadUrl `
            > "./deployment-artifact/artifact.zip"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Artifact download failed."
              exit 1
          }

          $fileSize = `
            (Get-Item "./deployment-artifact/artifact.zip").Length

          Write-Host ""
          Write-Host "Downloaded artifact size:"
          Write-Host "$fileSize bytes"

          if ($fileSize -le 0) {
              Write-Error "Downloaded artifact is empty."
              exit 1
          }


      # ==========================================================
      # 7. EXTRACT ARTIFACT
      # ==========================================================

      - name: Extract Export Artifact
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "EXTRACTING EXPORT ARTIFACT"
          Write-Host "======================================================"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "./deployment-artifact/extracted" |
            Out-Null

          Expand-Archive `
            -Path "./deployment-artifact/artifact.zip" `
            -DestinationPath "./deployment-artifact/extracted" `
            -Force

          Write-Host ""
          Write-Host "Artifact contents:"
          Get-ChildItem `
            -Path "./deployment-artifact/extracted" `
            -Recurse |
            Select-Object FullName


      # ==========================================================
      # 8. FIND SOLUTION ZIP
      # ==========================================================

      - name: Find Solution ZIP
        shell: pwsh
        env:
          BUILD_NUMBER: ${{ inputs.buildNumber }}
          DEPLOYMENT_TYPE: ${{ inputs.deploymentType }}
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "LOCATING SOLUTION PACKAGE"
          Write-Host "======================================================"

          $root = "./deployment-artifact/extracted"

          if ($env:DEPLOYMENT_TYPE -eq "managed") {

              Write-Host "Deployment type: MANAGED"

              $searchPath = `
                Join-Path $root "output/managed"

              $pattern = "*_managed.zip"
          }
          else {

              Write-Host "Deployment type: UNMANAGED"

              $searchPath = `
                Join-Path $root "output/unmanaged"

              $pattern = "*_unmanaged.zip"
          }

          Write-Host ""
          Write-Host "Search path:"
          Write-Host $searchPath

          $solutionFiles = @()

          if (Test-Path $searchPath) {

              $solutionFiles = @(
                  Get-ChildItem `
                    -Path $searchPath `
                    -Filter $pattern `
                    -File
              )
          }

          # Support the source structure generated by the enterprise
          # export pipeline if the output folder structure differs.

          if ($solutionFiles.Count -eq 0) {

              Write-Host ""
              Write-Host "Standard output location did not contain the ZIP."
              Write-Host "Searching complete artifact..."

              $solutionFiles = @(
                  Get-ChildItem `
                    -Path $root `
                    -Recurse `
                    -Filter $pattern `
                    -File
              )
          }

          if ($solutionFiles.Count -eq 0) {

              Write-Error ""
              Write-Error "No solution ZIP was found."
              Write-Error "Build: $env:BUILD_NUMBER"
              Write-Error "Deployment Type: $env:DEPLOYMENT_TYPE"

              Write-Host ""
              Write-Host "Available files:"
              Get-ChildItem `
                -Path $root `
                -Recurse

              exit 1
          }

          Write-Host ""
          Write-Host "Solution ZIP files found:"

          foreach ($file in $solutionFiles) {
              Write-Host $file.FullName
          }

          # If multiple solutions exist, create a deployment list.
          $deploymentList = @()

          foreach ($file in $solutionFiles) {
              $deploymentList += $file.FullName
          }

          $deploymentList |
            Out-File `
              -FilePath "./deployment-artifact/deployment-files.txt" `
              -Encoding utf8

          Write-Host ""
          Write-Host "Deployment file list created."


      # ==========================================================
      # 9. INSTALL .NET
      # ==========================================================

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"


      # ==========================================================
      # 10. INSTALL POWER PLATFORM CLI
      # ==========================================================

      - name: Install Power Platform CLI
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "Installing Power Platform CLI..."

          dotnet tool install `
            --global `
            Microsoft.PowerApps.CLI.Tool

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Power Platform CLI installation failed."
              exit 1
          }


      # ==========================================================
      # 11. ADD PAC TO PATH
      # ==========================================================

      - name: Add PAC to PATH
        shell: pwsh
        run: |

          $pacPath = "$env:USERPROFILE\.dotnet\tools"

          $pacPath |
            Out-File `
              -FilePath $env:GITHUB_PATH `
              -Encoding utf8 `
              -Append

          Write-Host "PAC path added:"
          Write-Host $pacPath


      # ==========================================================
      # 12. VERIFY PAC
      # ==========================================================

      - name: Verify PAC Installation
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "VERIFYING PAC"
          Write-Host "======================================================"

          pac help

          if ($LASTEXITCODE -ne 0) {
              Write-Error "PAC CLI verification failed."
              exit 1
          }


      # ==========================================================
      # 13. LOAD TARGET ENVIRONMENT
      # ==========================================================

      - name: Configure Target Environment
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "TARGET ENVIRONMENT"
          Write-Host "======================================================"

          $target = "${{ inputs.targetEnvironment }}"

          switch ($target) {

              "PROD" {
                  $environmentUrl = "${{ secrets.PROD_URL }}"
                  Write-Host "Target environment: PROD"
              }

              default {
                  Write-Error "Unsupported target environment: $target"
                  exit 1
              }
          }

          if ([string]::IsNullOrWhiteSpace($environmentUrl)) {
              Write-Error "Target environment URL is not configured."
              exit 1
          }

          "TARGET_URL=$environmentUrl" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


      # ==========================================================
      # 14. AUTHENTICATE TO TARGET ENVIRONMENT
      # ==========================================================

      - name: Authenticate to Target Environment
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "AUTHENTICATING TO TARGET ENVIRONMENT"
          Write-Host "======================================================"

          pac auth create `
            --applicationId "${{ secrets.CLIENT_ID }}" `
            --clientSecret "${{ secrets.CLIENT_SECRET }}" `
            --tenant "${{ secrets.TENANT_ID }}" `
            --environment "$env:TARGET_URL"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Authentication failed."
              exit 1
          }


      # ==========================================================
      # 15. VERIFY AUTHENTICATION
      # ==========================================================

      - name: Verify Target Authentication
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "TARGET PAC AUTHENTICATION"
          Write-Host "======================================================"

          pac auth list


      # ==========================================================
      # 16. LOAD DEPLOYMENT SETTINGS
      # ==========================================================

      - name: Load Deployment Settings
        shell: pwsh
        env:
          TARGET_ENVIRONMENT: ${{ inputs.targetEnvironment }}
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "DEPLOYMENT SETTINGS"
          Write-Host "======================================================"

          $settingsCandidates = @(
              "./Deployment Setting/ATT-$env:TARGET_ENVIRONMENT.json",
              "./Deployment Setting/ATT-$env:TARGET_ENVIRONMENT-.json",
              "./DeploymentSettings/ATT-$env:TARGET_ENVIRONMENT.json"
          )

          $settingsFile = $null

          foreach ($candidate in $settingsCandidates) {

              if (Test-Path $candidate) {
                  $settingsFile = $candidate
                  break
              }
          }

          if ($null -eq $settingsFile) {

              Write-Host ""
              Write-Host "No deployment settings JSON found."
              Write-Host "Continuing because deployment settings are optional"
              Write-Host "until the environment-specific files are added."

              "DEPLOYMENT_SETTINGS_FILE=" |
                Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

              exit 0
          }

          Write-Host "Deployment settings file:"
          Write-Host $settingsFile

          Get-Content $settingsFile

          "DEPLOYMENT_SETTINGS_FILE=$settingsFile" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


      # ==========================================================
      # 17. PATCH CONNECTOR HOSTS
      # ==========================================================
      #
      # Runs only when your script exists.
      # ==========================================================

      - name: Patch Connector URLs
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "PATCH CONNECTOR URLS"
          Write-Host "======================================================"

          $script = "./PowershellScripts/patch-connector-host.ps1"

          if (Test-Path $script) {

              Write-Host "Running:"
              Write-Host $script

              & $script `
                -Environment "${{ inputs.targetEnvironment }}"

              if ($LASTEXITCODE -ne 0) {
                  Write-Error "Connector URL patching failed."
                  exit 1
              }
          }
          else {

              Write-Host "patch-connector-host.ps1 not found."
              Write-Host "Skipping this step."
          }


      # ==========================================================
      # 18. RESOLVE CONNECTION REFERENCES
      # ==========================================================

      - name: Resolve Connection References
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "RESOLVE CONNECTION REFERENCES"
          Write-Host "======================================================"

          $script = "./PowershellScripts/resolve-connrefs.ps1"

          if (Test-Path $script) {

              Write-Host "Running:"
              Write-Host $script

              & $script `
                -Environment "${{ inputs.targetEnvironment }}"

              if ($LASTEXITCODE -ne 0) {
                  Write-Error "Connection reference resolution failed."
                  exit 1
              }
          }
          else {

              Write-Host "resolve-connrefs.ps1 not found."
              Write-Host "Skipping this step."
          }


      # ==========================================================
      # 19. IMPORT SOLUTIONS
      # ==========================================================

      - name: Import Solutions
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "IMPORTING POWER PLATFORM SOLUTIONS"
          Write-Host "======================================================"

          $files = Get-Content `
            "./deployment-artifact/deployment-files.txt"

          if ($files.Count -eq 0) {
              Write-Error "No deployment files found."
              exit 1
          }

          foreach ($solutionFile in $files) {

              Write-Host ""
              Write-Host "------------------------------------------------------"
              Write-Host "Importing:"
              Write-Host $solutionFile
              Write-Host "------------------------------------------------------"

              if ("${{ inputs.deploymentType }}" -eq "managed") {

                  Write-Host "Deployment type: MANAGED"

                  pac solution import `
                    --path "$solutionFile" `
                    --async `
                    --publish-changes

              }
              else {

                  Write-Host "Deployment type: UNMANAGED"

                  pac solution import `
                    --path "$solutionFile" `
                    --async `
                    --publish-changes
              }

              if ($LASTEXITCODE -ne 0) {
                  Write-Error "Solution import failed:"
                  Write-Error $solutionFile
                  exit 1
              }

              Write-Host "Import completed successfully."
          }


      # ==========================================================
      # 20. OPTIONAL STAGE AND UPGRADE
      # ==========================================================

      - name: Stage and Upgrade
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "STAGE AND UPGRADE"
          Write-Host "======================================================"

          $script = "./PowershellScripts/stage-and-upgrade.ps1"

          if (Test-Path $script) {

              Write-Host "StageAndUpgrade script found."
              Write-Host "Running..."

              & $script `
                -Environment "${{ inputs.targetEnvironment }}"

              if ($LASTEXITCODE -ne 0) {
                  Write-Error "Stage and Upgrade failed."
                  exit 1
              }

          }
          else {

              Write-Host "StageAndUpgrade script not found."
              Write-Host "Skipping optional operation."
          }


      # ==========================================================
      # 21. PUBLISH CUSTOMIZATIONS
      # ==========================================================

      - name: Publish Customizations
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "PUBLISHING CUSTOMIZATIONS"
          Write-Host "======================================================"

          pac solution publish

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Publishing customizations failed."
              exit 1
          }

          Write-Host "Customizations published successfully."


      # ==========================================================
      # 22. VERIFY PUBLISH
      # ==========================================================

      - name: Verify Publish
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "VERIFY PUBLISH"
          Write-Host "======================================================"

          $script = "./PowershellScripts/verify-publish.ps1"

          if (Test-Path $script) {

              & $script `
                -Environment "${{ inputs.targetEnvironment }}"

              if ($LASTEXITCODE -ne 0) {
                  Write-Error "Publish verification failed."
                  exit 1
              }

          }
          else {

              Write-Host "verify-publish.ps1 not found."
              Write-Host "Skipping optional verification script."
          }


      # ==========================================================
      # 23. FIX MANY-TO-MANY BOT RELATIONSHIPS
      # ==========================================================

      - name: Fix Bot Relationships
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "FIX BOT RELATIONSHIPS"
          Write-Host "======================================================"

          $script = "./PowershellScripts/fix-m2m-links.ps1"

          if (Test-Path $script) {

              & $script `
                -Environment "${{ inputs.targetEnvironment }}"

              if ($LASTEXITCODE -ne 0) {
                  Write-Error "Bot relationship fix failed."
                  exit 1
              }

          }
          else {

              Write-Host "fix-m2m-links.ps1 not found."
              Write-Host "Skipping optional bot relationship fix."
          }


      # ==========================================================
      # 24. PUBLISH COPILOT BOT
      # ==========================================================

      - name: Publish Copilot Bot
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "PUBLISH COPILOT BOT"
          Write-Host "======================================================"

          $script = "./PowershellScripts/publish-bot.ps1"

          if (Test-Path $script) {

              & $script `
                -Environment "${{ inputs.targetEnvironment }}"

              if ($LASTEXITCODE -ne 0) {
                  Write-Error "Copilot bot publishing failed."
                  exit 1
              }

          }
          else {

              Write-Host "publish-bot.ps1 not found."
              Write-Host "Skipping optional Copilot publishing."
          }


      # ==========================================================
      # 25. DEPLOYMENT SUMMARY
      # ==========================================================

      - name: Deployment Summary
        if: success()
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host ""
          Write-Host "======================================================"
          Write-Host "ATT DEPLOYMENT SUCCESSFUL"
          Write-Host "======================================================"
          Write-Host "Build              : ${{ inputs.buildNumber }}"
          Write-Host "Export Run ID      : $env:EXPORT_RUN_ID"
          Write-Host "Artifact           : $env:ARTIFACT_NAME"
          Write-Host "Deployment Type    : ${{ inputs.deploymentType }}"
          Write-Host "Target Environment : ${{ inputs.targetEnvironment }}"
          Write-Host "======================================================"
          Write-Host ""


      # ==========================================================
      # 26. FAILURE DIAGNOSTICS
      # ==========================================================

      - name: Diagnose Deployment Failure
        if: failure()
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "ATT DEPLOYMENT FAILED"
          Write-Host "======================================================"

          $script = "./PowershellScripts/diagnose-failure.ps1"

          if (Test-Path $script) {

              Write-Host "Running failure diagnostics..."

              & $script `
                -Environment "${{ inputs.targetEnvironment }}"

          }
          else {

              Write-Host "diagnose-failure.ps1 not found."

              Write-Host ""
              Write-Host "Deployment information:"
              Write-Host "Build              : ${{ inputs.buildNumber }}"
              Write-Host "Deployment Type    : ${{ inputs.deploymentType }}"
              Write-Host "Target Environment : ${{ inputs.targetEnvironment }}"
              Write-Host "Export Run ID      : $env:EXPORT_RUN_ID"
              Write-Host "Artifact           : $env:ARTIFACT_NAME"
          }