name: Power Platform CI

on:
  push:
    branches:
      - main

jobs:
  export-solution:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Power Platform CLI
        shell: pwsh
        run: |
          dotnet tool install --global Microsoft.PowerApps.CLI.Tool

      - name: Add PAC to PATH
        shell: pwsh
        run: |
          echo "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify PAC Installation
        shell: pwsh
        run: |
          pac help

      - name: Authenticate to Power Platform
        shell: pwsh
        run: |
          pac auth create `
            --applicationId "${{ secrets.CLIENT_ID }}" `
            --clientSecret "${{ secrets.CLIENT_SECRET }}" `
            --tenant "${{ secrets.TENANT_ID }}" `
            --environment "${{ secrets.DEV_URL }}"

      - name: Verify Authentication
        shell: pwsh
        run: |
          pac auth list

      - name: Export Managed Solution
        shell: pwsh
        run: |
          mkdir output
          pac solution export `
            --name "AccountContactsExport" `
            --path "./output/AccountContactsExport.zip" `
            --managed

      - name: Upload Solution Artifact
        uses: actions/upload-artifact@v4
        with:
          name: managed-solution
          path: ./output/AccountContactsExport.zip