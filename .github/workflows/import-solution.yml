name: ATT Import Solution

on:
  workflow_dispatch:
    inputs:

      targetEnvironment:
        description: "Select target environment"
        required: true
        type: choice
        options:
          - TEST
          - UAT
          - PROD
        default: PROD

permissions:
  contents: read
  actions: read

concurrency:
  group: att-import-${{ inputs.targetEnvironment }}
  cancel-in-progress: false


jobs:

  import-solution:

    runs-on: windows-latest

    steps:

      # ==========================================================
      # 1. CHECKOUT REPOSITORY
      # ==========================================================

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1


      # ==========================================================
      # 2. DISPLAY DEPLOYMENT INFORMATION
      # ==========================================================

      - name: Display Deployment Information
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "ATT IMPORT / DEPLOYMENT PIPELINE"
          Write-Host "======================================================"
          Write-Host "Target Environment : ${{ inputs.targetEnvironment }}"
          Write-Host "Deployment Type    : MANAGED"
          Write-Host "======================================================"
          Write-Host ""

          Write-Host "Higher environments always receive MANAGED solutions."


      # ==========================================================
      # 3. FIND ATT EXPORT WORKFLOW
      # ==========================================================

      - name: Find ATT Export Workflow
        id: find-export-workflow
        uses: actions/github-script@v7
        with:
          script: |

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const response =
              await github.rest.actions.listRepoWorkflows({
                owner: owner,
                repo: repo,
                per_page: 100
              });

            const workflow =
              response.data.workflows.find(
                w => w.name === "ATT Export Solution"
              );

            if (!workflow) {
              core.setFailed(
                "ATT Export Solution workflow was not found."
              );
              return;
            }

            console.log(
              `ATT Export Solution workflow found. ID: ${workflow.id}`
            );

            core.setOutput(
              "workflow_id",
              workflow.id.toString()
            );


      # ==========================================================
      # 4. FIND LATEST SUCCESSFUL EXPORT RUN
      # ==========================================================

      - name: Find Latest Successful Export Run
        id: find-export-run
        uses: actions/github-script@v7
        env:
          EXPORT_WORKFLOW_ID: ${{ steps.find-export-workflow.outputs.workflow_id }}
        with:
          script: |

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const workflowId =
              Number(process.env.EXPORT_WORKFLOW_ID);

            console.log(
              "Searching for latest successful ATT Export run..."
            );

            const response =
              await github.rest.actions.listWorkflowRuns({
                owner: owner,
                repo: repo,
                workflow_id: workflowId,
                branch: "main",
                status: "success",
                per_page: 50
              });

            if (
              !response.data.workflow_runs ||
              response.data.workflow_runs.length === 0
            ) {
              core.setFailed(
                "No successful ATT Export Solution run was found."
              );
              return;
            }

            const successfulRun =
              response.data.workflow_runs[0];

            console.log("");
            console.log(
              "Latest successful export run:"
            );

            console.log(
              `Run ID: ${successfulRun.id}`
            );

            console.log(
              `Run Number: ${successfulRun.run_number}`
            );

            console.log(
              `Commit: ${successfulRun.head_sha}`
            );

            console.log(
              `Created: ${successfulRun.created_at}`
            );

            core.setOutput(
              "run_id",
              successfulRun.id.toString()
            );

            core.setOutput(
              "run_number",
              successfulRun.run_number.toString()
            );

            core.setOutput(
              "commit_sha",
              successfulRun.head_sha
            );


      # ==========================================================
      # 5. FIND ARTIFACT FROM THAT EXPORT RUN
      # ==========================================================

      - name: Find Export Artifact
        id: find-artifact
        uses: actions/github-script@v7
        env:
          EXPORT_RUN_ID: ${{ steps.find-export-run.outputs.run_id }}
        with:
          script: |

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const runId =
              Number(process.env.EXPORT_RUN_ID);

            console.log(
              `Searching artifacts for export run ${runId}...`
            );

            const response =
              await github.rest.actions.listWorkflowRunArtifacts({
                owner: owner,
                repo: repo,
                run_id: runId,
                per_page: 100
              });

            const artifacts =
              response.data.artifacts.filter(
                artifact => !artifact.expired
              );

            if (artifacts.length === 0) {
              core.setFailed(
                "No artifact was found in the successful export run."
              );
              return;
            }

            console.log("");
            console.log("Available artifacts:");

            for (const artifact of artifacts) {

              console.log(
                `${artifact.name} - ${artifact.size_in_bytes} bytes`
              );

            }

            const artifact =
              artifacts.find(
                a =>
                  a.name.startsWith(
                    "powerplatform-solutions"
                  )
              );

            if (!artifact) {

              core.setFailed(
                "powerplatform-solutions artifact was not found."
              );

              return;
            }

            console.log("");
            console.log(
              `Selected artifact: ${artifact.name}`
            );

            console.log(
              `Artifact ID: ${artifact.id}`
            );

            core.setOutput(
              "artifact_id",
              artifact.id.toString()
            );

            core.setOutput(
              "artifact_name",
              artifact.name
            );


      # ==========================================================
      # 6. DOWNLOAD ARTIFACT
      # ==========================================================

      - name: Download Export Artifact
        uses: actions/github-script@v7
        env:
          ARTIFACT_ID: ${{ steps.find-artifact.outputs.artifact_id }}
        with:
          script: |

            const fs = require("fs");

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const artifactId =
              Number(process.env.ARTIFACT_ID);

            console.log(
              `Downloading artifact ${artifactId}...`
            );

            const response =
              await github.rest.actions.downloadArtifact({
                owner: owner,
                repo: repo,
                artifact_id: artifactId,
                archive_format: "zip"
              });

            fs.mkdirSync(
              "./artifact-download",
              { recursive: true }
            );

            fs.writeFileSync(
              "./artifact-download/export-artifact.zip",
              Buffer.from(response.data)
            );

            console.log(
              "Artifact downloaded successfully."
            );


      # ==========================================================
      # 7. EXTRACT ARTIFACT
      # ==========================================================

      - name: Extract Export Artifact
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "EXTRACTING EXPORT ARTIFACT"
          Write-Host "======================================================"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "./artifact-content" |
            Out-Null

          Expand-Archive `
            -Path "./artifact-download/export-artifact.zip" `
            -DestinationPath "./artifact-content" `
            -Force

          Write-Host ""
          Write-Host "Artifact contents:"
          Write-Host ""

          Get-ChildItem `
            -Path "./artifact-content" `
            -Recurse


      # ==========================================================
      # 8. FIND MANAGED SOLUTION ZIP
      # ==========================================================

      - name: Locate Managed Solution
        id: locate-solution
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "LOCATING MANAGED SOLUTION"
          Write-Host "======================================================"

          $solutionZip =
            Get-ChildItem `
              -Path "./artifact-content" `
              -Recurse `
              -Filter "*_managed.zip" |
            Select-Object -First 1

          if (-not $solutionZip) {

              Write-Host ""
              Write-Host "Available ZIP files:"
              Write-Host ""

              Get-ChildItem `
                -Path "./artifact-content" `
                -Recurse `
                -Filter "*.zip"

              Write-Error `
                "Managed solution ZIP was not found."

              exit 1
          }

          Write-Host ""
          Write-Host "Managed solution found:"
          Write-Host $solutionZip.FullName

          "SOLUTION_ZIP=$($solutionZip.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


      # ==========================================================
      # 9. DETERMINE TARGET ENVIRONMENT URL
      # ==========================================================

      - name: Configure Target Environment
        id: target-config
        shell: pwsh
        env:
          TARGET_ENVIRONMENT: ${{ inputs.targetEnvironment }}
          PROD_URL: ${{ secrets.PROD_URL }}
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "TARGET ENVIRONMENT CONFIGURATION"
          Write-Host "======================================================"

          $target =
            $env:TARGET_ENVIRONMENT

          Write-Host "Selected environment: $target"

          if (
              [string]::IsNullOrWhiteSpace(
                $env:PROD_URL
              )
          ) {

              Write-Error `
                "PROD_URL repository secret is missing."

              exit 1
          }

          # ------------------------------------------------------
          # CURRENT SETUP
          #
          # TEST -> PROD_URL temporarily
          # UAT  -> PROD_URL temporarily
          # PROD -> PROD_URL
          #
          # Later we can replace these with:
          #
          # TEST -> TEST_URL
          # UAT  -> UAT_URL
          # PROD -> PROD_URL
          # ------------------------------------------------------

          switch ($target) {

              "TEST" {

                  Write-Host ""
                  Write-Host "TEST selected."
                  Write-Host "Using PROD_URL temporarily."
                  $environmentUrl = $env:PROD_URL
              }

              "UAT" {

                  Write-Host ""
                  Write-Host "UAT selected."
                  Write-Host "Using PROD_URL temporarily."
                  $environmentUrl = $env:PROD_URL
              }

              "PROD" {

                  Write-Host ""
                  Write-Host "PROD selected."
                  Write-Host "Using PROD_URL."
                  $environmentUrl = $env:PROD_URL
              }

              default {

                  Write-Error `
                    "Unsupported target environment: $target"

                  exit 1
              }
          }

          if (
              [string]::IsNullOrWhiteSpace(
                $environmentUrl
              )
          ) {

              Write-Error `
                "Target environment URL could not be determined."

              exit 1
          }

          "TARGET_URL=$environmentUrl" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host ""
          Write-Host "Target environment configured successfully."
          Write-Host "Target: $target"


      # ==========================================================
      # 10. INSTALL .NET
      # ==========================================================

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"


      # ==========================================================
      # 11. INSTALL POWER PLATFORM CLI
      # ==========================================================

      - name: Install Power Platform CLI
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "Installing Power Platform CLI..."

          dotnet tool install `
            --global `
            Microsoft.PowerApps.CLI.Tool

          if ($LASTEXITCODE -ne 0) {

              Write-Error `
                "Power Platform CLI installation failed."

              exit 1
          }


      # ==========================================================
      # 12. ADD PAC TO PATH
      # ==========================================================

      - name: Add PAC to PATH
        shell: pwsh
        run: |

          $pacPath =
            "$env:USERPROFILE\.dotnet\tools"

          $pacPath |
            Out-File `
              -FilePath $env:GITHUB_PATH `
              -Encoding utf8 `
              -Append


      # ==========================================================
      # 13. VERIFY PAC
      # ==========================================================

      - name: Verify PAC Installation
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "VERIFYING PAC CLI"
          Write-Host "======================================================"

          pac help

          if ($LASTEXITCODE -ne 0) {

              Write-Error `
                "PAC CLI verification failed."

              exit 1
          }


      # ==========================================================
      # 14. AUTHENTICATE TO TARGET ENVIRONMENT
      # ==========================================================

      - name: Authenticate to Target Environment
        shell: pwsh
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          TENANT_ID: ${{ secrets.TENANT_ID }}
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "AUTHENTICATING TO TARGET ENVIRONMENT"
          Write-Host "======================================================"

          Write-Host "Target Environment:"
          Write-Host "${{ inputs.targetEnvironment }}"

          if (
              [string]::IsNullOrWhiteSpace(
                $env:CLIENT_ID
              )
          ) {

              Write-Error "CLIENT_ID secret is missing."
              exit 1
          }

          if (
              [string]::IsNullOrWhiteSpace(
                $env:CLIENT_SECRET
              )
          ) {

              Write-Error "CLIENT_SECRET secret is missing."
              exit 1
          }

          if (
              [string]::IsNullOrWhiteSpace(
                $env:TENANT_ID
              )
          ) {

              Write-Error "TENANT_ID secret is missing."
              exit 1
          }

          if (
              [string]::IsNullOrWhiteSpace(
                $env:TARGET_URL
              )
          ) {

              Write-Error "TARGET_URL is missing."
              exit 1
          }

          Write-Host ""
          Write-Host "Connecting to:"
          Write-Host "$env:TARGET_URL"

          pac auth create `
            --applicationId "$env:CLIENT_ID" `
            --clientSecret "$env:CLIENT_SECRET" `
            --tenant "$env:TENANT_ID" `
            --environment "$env:TARGET_URL"

          if ($LASTEXITCODE -ne 0) {

              Write-Error `
                "Authentication to target environment failed."

              exit 1
          }


      # ==========================================================
      # 15. VERIFY AUTHENTICATION
      # ==========================================================

      - name: Verify Authentication
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "PAC AUTHENTICATION"
          Write-Host "======================================================"

          pac auth list


      # ==========================================================
      # 16. LOAD DEPLOYMENT SETTINGS
      # ==========================================================

      - name: Load Deployment Settings
        shell: pwsh
        env:
          TARGET_ENVIRONMENT: ${{ inputs.targetEnvironment }}
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "DEPLOYMENT SETTINGS"
          Write-Host "======================================================"

          $target =
            $env:TARGET_ENVIRONMENT

          $settingsPath =
            "./Deployment Settings/ATT-$target.json"

          if (Test-Path $settingsPath) {

              Write-Host ""
              Write-Host "Deployment settings found:"
              Write-Host $settingsPath

              Write-Host ""
              Write-Host "Deployment settings:"
              Get-Content $settingsPath

          }
          else {

              Write-Host ""
              Write-Host "No deployment settings file found for:"
              Write-Host $target

              Write-Host ""
              Write-Host "Expected:"
              Write-Host $settingsPath

              Write-Host ""
              Write-Host "Continuing because deployment settings"
              Write-Host "are not configured yet."
          }


      # ==========================================================
      # 17. IMPORT MANAGED SOLUTION
      # ==========================================================

      - name: Import Managed Solution
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "IMPORTING MANAGED SOLUTION"
          Write-Host "======================================================"

          Write-Host ""
          Write-Host "Target Environment:"
          Write-Host "${{ inputs.targetEnvironment }}"

          Write-Host ""
          Write-Host "Solution ZIP:"
          Write-Host "$env:SOLUTION_ZIP"

          if (-not (Test-Path "$env:SOLUTION_ZIP")) {

              Write-Error `
                "Solution ZIP does not exist."

              exit 1
          }

          pac solution import `
            --path "$env:SOLUTION_ZIP"

          if ($LASTEXITCODE -ne 0) {

              Write-Error `
                "Managed solution import failed."

              exit 1
          }

          Write-Host ""
          Write-Host "Managed solution imported successfully."


      # ==========================================================
      # 18. PUBLISH CUSTOMIZATIONS
      # ==========================================================

      - name: Publish Customizations
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "PUBLISHING CUSTOMIZATIONS"
          Write-Host "======================================================"

          pac solution publish

          if ($LASTEXITCODE -ne 0) {

              Write-Error `
                "Publishing customizations failed."

              exit 1
          }

          Write-Host ""
          Write-Host "Customizations published successfully."


      # ==========================================================
      # 19. VERIFY DEPLOYMENT
      # ==========================================================

      - name: Verify Deployment
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "VERIFYING DEPLOYMENT"
          Write-Host "======================================================"

          pac solution list

          if ($LASTEXITCODE -ne 0) {

              Write-Error `
                "Unable to verify solutions in target environment."

              exit 1
          }


      # ==========================================================
      # 20. DEPLOYMENT SUMMARY
      # ==========================================================

      - name: Deployment Summary
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host ""
          Write-Host "######################################################"
          Write-Host "ATT DEPLOYMENT SUCCESSFUL"
          Write-Host "######################################################"
          Write-Host ""
          Write-Host "Target Environment : ${{ inputs.targetEnvironment }}"
          Write-Host "Deployment Type    : MANAGED"
          Write-Host "Export Run ID      : ${{ steps.find-export-run.outputs.run_id }}"
          Write-Host "Export Run Number  : ${{ steps.find-export-run.outputs.run_number }}"
          Write-Host "Artifact           : ${{ steps.find-artifact.outputs.artifact_name }}"
          Write-Host ""
          Write-Host "Solution imported successfully."
          Write-Host "Customizations published successfully."
          Write-Host "######################################################"
