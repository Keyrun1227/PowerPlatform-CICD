name: ATT Import Solution

on:
  workflow_dispatch:
    inputs:

      sourceEnvironment:
        description: "Select source environment"
        required: true
        type: choice
        options:
          - CCaaS
          - DEV
          - UAT
          - PROD

      solutionName:
        description: "Enter exact solution name to deploy"
        required: true
        type: string

      deploymentType:
        description: "Select deployment type"
        required: true
        type: choice
        options:
          - managed
          - unmanaged

      targetEnvironment:
        description: "Select target environment"
        required: true
        type: choice
        options:
          - CCaaS
          - DEV
          - UAT
          - PROD


# ============================================================
# PERMISSIONS
# ============================================================

permissions:
  contents: read
  actions: read


# ============================================================
# CONCURRENCY
# ============================================================

concurrency:
  group: att-import-${{ inputs.targetEnvironment }}
  cancel-in-progress: false


# ============================================================
# JOB
# ============================================================

jobs:

  import-solution:

    runs-on: windows-latest

    steps:

      # ========================================================
      # 1. DISPLAY DEPLOYMENT INFORMATION
      # ========================================================

      - name: Display Deployment Information
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "ATT IMPORT / DEPLOYMENT PIPELINE"
          Write-Host "======================================================"

          Write-Host ""
          Write-Host "Source Environment:"
          Write-Host "${{ inputs.sourceEnvironment }}"

          Write-Host ""
          Write-Host "Solution:"
          Write-Host "${{ inputs.solutionName }}"

          Write-Host ""
          Write-Host "Target Environment:"
          Write-Host "${{ inputs.targetEnvironment }}"

          Write-Host ""
          Write-Host "Deployment Type:"
          Write-Host "${{ inputs.deploymentType }}"

          Write-Host ""
          Write-Host "======================================================"


      # ========================================================
      # 2. CHECKOUT REPOSITORY
      # ========================================================

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ========================================================
      # 3. INSTALL .NET
      # ========================================================

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"


      # ========================================================
      # 4. INSTALL POWER PLATFORM CLI
      # ========================================================

      - name: Install Power Platform CLI
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "INSTALLING POWER PLATFORM CLI"
          Write-Host "======================================================"

          dotnet tool install --global Microsoft.PowerApps.CLI.Tool

          if ($LASTEXITCODE -ne 0) {

              Write-Error "Power Platform CLI installation failed."

              exit 1
          }


      # ========================================================
      # 5. ADD PAC TO PATH
      # ========================================================

      - name: Add PAC to PATH
        shell: pwsh
        run: |

          $pacPath = "$env:USERPROFILE\.dotnet\tools"

          Write-Host ""
          Write-Host "PAC path:"
          Write-Host $pacPath

          $pacPath |
            Out-File `
              -FilePath $env:GITHUB_PATH `
              -Encoding utf8 `
              -Append


      # ========================================================
      # 6. VERIFY PAC
      # ========================================================

      - name: Verify PAC Installation
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "VERIFYING PAC CLI"
          Write-Host "======================================================"

          pac help

          if ($LASTEXITCODE -ne 0) {

              Write-Error "PAC CLI verification failed."

              exit 1
          }


      # ========================================================
      # 7. FIND MATCHING SUCCESSFUL EXPORT
      # ========================================================

      - name: Find Matching Successful Export
        shell: pwsh

        env:

          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}

          SOURCE_ENVIRONMENT: ${{ inputs.sourceEnvironment }}
          SOLUTION_NAME: ${{ inputs.solutionName }}

        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "SEARCHING FOR MATCHING EXPORT"
          Write-Host "======================================================"

          Write-Host ""
          Write-Host "Requested Source:"
          Write-Host $env:SOURCE_ENVIRONMENT

          Write-Host ""
          Write-Host "Requested Solution:"
          Write-Host $env:SOLUTION_NAME


          $headers = @{

              Authorization = "Bearer $env:GH_TOKEN"

              Accept = "application/vnd.github+json"

              "X-GitHub-Api-Version" = "2022-11-28"
          }


          # ======================================================
          # GET SUCCESSFUL EXPORT RUNS
          # ======================================================

          $runsUrl =
            "https://api.github.com/repos/$env:REPOSITORY/actions/workflows/export-solution.yml/runs?status=success&per_page=100"


          Write-Host ""
          Write-Host "Querying:"
          Write-Host $runsUrl


          try {

              $response =
                Invoke-RestMethod `
                  -Uri $runsUrl `
                  -Headers $headers `
                  -Method Get

          }
          catch {

              Write-Error "Unable to query GitHub Export workflow."
              Write-Error $_

              exit 1
          }


          if ($null -eq $response.workflow_runs) {

              Write-Error "GitHub returned no workflow runs."

              exit 1
          }


          $successfulRuns =
            @(
                $response.workflow_runs |
                Where-Object {
                    $_.conclusion -eq "success"
                }
            )


          if ($successfulRuns.Count -eq 0) {

              Write-Error ""
              Write-Error "======================================================"
              Write-Error "NO SUCCESSFUL EXPORT FOUND"
              Write-Error "======================================================"

              exit 1
          }


          # ======================================================
          # SEARCH NEWEST RUNS FIRST
          # ======================================================

          $successfulRuns =
            $successfulRuns |
            Sort-Object created_at -Descending


          $matchingRun = $null
          $matchingArtifact = $null


          foreach ($run in $successfulRuns) {

              Write-Host ""
              Write-Host "------------------------------------------------------"
              Write-Host "Checking Export Run:"
              Write-Host $run.run_number
              Write-Host "Created:"
              Write-Host $run.created_at
              Write-Host "------------------------------------------------------"


              $artifactsUrl =
                "https://api.github.com/repos/$env:REPOSITORY/actions/runs/$($run.id)/artifacts"


              try {

                  $artifactResponse =
                    Invoke-RestMethod `
                      -Uri $artifactsUrl `
                      -Headers $headers `
                      -Method Get

              }
              catch {

                  Write-Host ""
                  Write-Host "Unable to read artifacts for run:"
                  Write-Host $run.run_number

                  continue
              }


              $artifacts =
                @(
                    $artifactResponse.artifacts |
                    Where-Object {
                        $_.expired -eq $false
                    }
                )


              foreach ($artifact in $artifacts) {

                  Write-Host ""
                  Write-Host "Artifact:"
                  Write-Host $artifact.name


                  if (
                    $artifact.name -notlike
                    "powerplatform-solutions-*"
                  ) {

                      continue
                  }


                  # ==================================================
                  # DOWNLOAD CANDIDATE ARTIFACT
                  # ==================================================

                  $candidateDirectory =
                    "./candidate-artifact"


                  if (Test-Path $candidateDirectory) {

                      Remove-Item `
                        -Path $candidateDirectory `
                        -Recurse `
                        -Force
                  }


                  New-Item `
                    -ItemType Directory `
                    -Force `
                    -Path $candidateDirectory |
                    Out-Null


                  $candidateZip =
                    "$candidateDirectory/export.zip"


                  $artifactUrl =
                    "https://api.github.com/repos/$env:REPOSITORY/actions/artifacts/$($artifact.id)/zip"


                  try {

                      Invoke-WebRequest `
                        -Uri $artifactUrl `
                        -Headers $headers `
                        -OutFile $candidateZip

                  }
                  catch {

                      Write-Host ""
                      Write-Host "Unable to download artifact:"
                      Write-Host $artifact.name

                      continue
                  }


                  # ==================================================
                  # EXTRACT CANDIDATE
                  # ==================================================

                  $candidateExtract =
                    "$candidateDirectory/extracted"


                  New-Item `
                    -ItemType Directory `
                    -Force `
                    -Path $candidateExtract |
                    Out-Null


                  try {

                      Expand-Archive `
                        -Path $candidateZip `
                        -DestinationPath $candidateExtract `
                        -Force

                  }
                  catch {

                      Write-Host ""
                      Write-Host "Unable to extract artifact:"
                      Write-Host $artifact.name

                      continue
                  }


                  # ==================================================
                  # FIND METADATA
                  # ==================================================

                  $metadata =
                    Get-ChildItem `
                      -Path $candidateExtract `
                      -Filter "export-metadata.json" `
                      -Recurse `
                      -File |
                    Select-Object -First 1


                  if ($null -eq $metadata) {

                      Write-Host ""
                      Write-Host "No export-metadata.json found."

                      continue
                  }


                  try {

                      $metadataObject =
                        Get-Content `
                          $metadata.FullName `
                          -Raw |
                        ConvertFrom-Json

                  }
                  catch {

                      Write-Host ""
                      Write-Host "Invalid export metadata."

                      continue
                  }


                  Write-Host ""
                  Write-Host "Metadata Source:"
                  Write-Host $metadataObject.sourceEnvironment

                  Write-Host ""
                  Write-Host "Metadata Build:"
                  Write-Host $metadataObject.build


                  # ==================================================
                  # VERIFY SOURCE
                  # ==================================================

                  if (
                    $metadataObject.sourceEnvironment `
                    -ne `
                    $env:SOURCE_ENVIRONMENT
                  ) {

                      Write-Host ""
                      Write-Host "Source environment does not match."

                      continue
                  }


                  # ==================================================
                  # VERIFY SOLUTION
                  # ==================================================

                  $solutionMatch = $false


                  foreach (
                    $exportedSolution
                    in $metadataObject.solutionNames
                  ) {

                      if (
                        $exportedSolution.Trim().ToLower() `
                        -eq `
                        $env:SOLUTION_NAME.Trim().ToLower()
                      ) {

                          $solutionMatch = $true

                          break
                      }
                  }


                  if (-not $solutionMatch) {

                      Write-Host ""
                      Write-Host "Solution does not exist in this export."

                      continue
                  }


                  # ==================================================
                  # MATCH FOUND
                  # ==================================================

                  $matchingRun =
                    $run

                  $matchingArtifact =
                    $artifact


                  Write-Host ""
                  Write-Host "======================================================"
                  Write-Host "MATCHING EXPORT FOUND"
                  Write-Host "======================================================"

                  Write-Host ""
                  Write-Host "Source:"
                  Write-Host $metadataObject.sourceEnvironment

                  Write-Host ""
                  Write-Host "Solution:"
                  Write-Host $env:SOLUTION_NAME

                  Write-Host ""
                  Write-Host "Build:"
                  Write-Host $metadataObject.build

                  Write-Host ""
                  Write-Host "Run Number:"
                  Write-Host $run.run_number

                  Write-Host ""
                  Write-Host "Artifact:"
                  Write-Host $artifact.name

                  Write-Host ""
                  Write-Host "======================================================"

                  break
              }


              if ($null -ne $matchingRun) {
                  break
              }
          }


          # ======================================================
          # FAIL IF NOTHING FOUND
          # ======================================================

          if ($null -eq $matchingRun) {

              Write-Error ""
              Write-Error "======================================================"
              Write-Error "NO MATCHING EXPORT FOUND"
              Write-Error "======================================================"

              Write-Error ""
              Write-Error "Source Environment:"
              Write-Error $env:SOURCE_ENVIRONMENT

              Write-Error ""
              Write-Error "Solution:"
              Write-Error $env:SOLUTION_NAME

              Write-Error ""
              Write-Error "Run the Export workflow first."

              exit 1
          }


          # ======================================================
          # SAVE MATCH
          # ======================================================

          "EXPORT_RUN_ID=$($matchingRun.id)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


          "EXPORT_RUN_NUMBER=$($matchingRun.run_number)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


          "EXPORT_COMMIT=$($matchingRun.head_sha)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


          "ARTIFACT_ID=$($matchingArtifact.id)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


          "ARTIFACT_NAME=$($matchingArtifact.name)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


      # ========================================================
      # 8. DOWNLOAD SELECTED EXPORT ARTIFACT
      # ========================================================

      - name: Download Export Artifact
        shell: pwsh

        env:

          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}

        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "DOWNLOADING SELECTED EXPORT ARTIFACT"
          Write-Host "======================================================"


          Write-Host ""
          Write-Host "Artifact:"
          Write-Host $env:ARTIFACT_NAME


          New-Item `
            -ItemType Directory `
            -Force `
            -Path "./deployment-artifact" |
            Out-Null


          $artifactUrl =
            "https://api.github.com/repos/$env:REPOSITORY/actions/artifacts/$env:ARTIFACT_ID/zip"


          $headers = @{

              Authorization =
                "Bearer $env:GH_TOKEN"

              Accept =
                "application/vnd.github+json"

              "X-GitHub-Api-Version" =
                "2022-11-28"
          }


          $artifactZip =
            "./deployment-artifact/export-artifact.zip"


          try {

              Invoke-WebRequest `
                -Uri $artifactUrl `
                -Headers $headers `
                -OutFile $artifactZip

          }
          catch {

              Write-Error "Failed to download Export artifact."
              Write-Error $_

              exit 1
          }


          if (-not (Test-Path $artifactZip)) {

              Write-Error "Downloaded artifact ZIP was not found."

              exit 1
          }


          Write-Host ""
          Write-Host "Artifact downloaded:"
          Write-Host $artifactZip


      # ========================================================
      # 9. EXTRACT ARTIFACT
      # ========================================================

      - name: Extract Export Artifact
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "EXTRACTING EXPORT ARTIFACT"
          Write-Host "======================================================"


          $extractPath =
            "./deployment-artifact/extracted"


          New-Item `
            -ItemType Directory `
            -Force `
            -Path $extractPath |
            Out-Null


          Expand-Archive `
            -Path "./deployment-artifact/export-artifact.zip" `
            -DestinationPath $extractPath `
            -Force


          Write-Host ""
          Write-Host "Extracted artifact contents:"


          Get-ChildItem `
            -Path $extractPath `
            -Recurse |
            Select-Object FullName


      # ========================================================
      # 10. VERIFY ARTIFACT METADATA
      # ========================================================

      - name: Verify Artifact Metadata
        shell: pwsh

        env:

          SOURCE_ENVIRONMENT: ${{ inputs.sourceEnvironment }}
          SOLUTION_NAME: ${{ inputs.solutionName }}

        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "VERIFYING ARTIFACT"
          Write-Host "======================================================"


          $metadata =
            Get-ChildItem `
              -Path "./deployment-artifact/extracted" `
              -Filter "export-metadata.json" `
              -Recurse `
              -File |
            Select-Object -First 1


          if ($null -eq $metadata) {

              Write-Error "export-metadata.json was not found."

              exit 1
          }


          $metadataObject =
            Get-Content `
              $metadata.FullName `
              -Raw |
            ConvertFrom-Json


          Write-Host ""
          Write-Host "Artifact Source:"
          Write-Host $metadataObject.sourceEnvironment

          Write-Host ""
          Write-Host "Requested Source:"
          Write-Host $env:SOURCE_ENVIRONMENT


          if (
            $metadataObject.sourceEnvironment `
            -ne `
            $env:SOURCE_ENVIRONMENT
          ) {

              Write-Error `
                "Artifact source environment does not match."

              exit 1
          }


          $solutionFound = $false


          foreach (
            $solution
            in $metadataObject.solutionNames
          ) {

              if (
                $solution.Trim().ToLower() `
                -eq `
                $env:SOLUTION_NAME.Trim().ToLower()
              ) {

                  $solutionFound = $true

                  break
              }
          }


          if (-not $solutionFound) {

              Write-Error ""
              Write-Error `
                "Requested solution was not found in artifact."

              Write-Error ""
              Write-Error "Requested:"
              Write-Error $env:SOLUTION_NAME

              exit 1
          }


          Write-Host ""
          Write-Host "Artifact verification successful."


      # ========================================================
      # 11. FIND SELECTED SOLUTION PACKAGE
      # ========================================================

      - name: Find Selected Solution Package
        shell: pwsh

        env:

          SOLUTION_NAME: ${{ inputs.solutionName }}
          DEPLOYMENT_TYPE: ${{ inputs.deploymentType }}

        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "FINDING SELECTED SOLUTION PACKAGE"
          Write-Host "======================================================"


          $root =
            "./deployment-artifact/extracted"


          if ($env:DEPLOYMENT_TYPE -eq "managed") {

              $pattern =
                "${env:SOLUTION_NAME}_managed.zip"

          }
          else {

              $pattern =
                "${env:SOLUTION_NAME}_unmanaged.zip"
          }


          Write-Host ""
          Write-Host "Expected package:"
          Write-Host $pattern


          $packages =
            @(
                Get-ChildItem `
                  -Path $root `
                  -Filter $pattern `
                  -Recurse `
                  -File
            )


          if ($packages.Count -eq 0) {

              Write-Error ""
              Write-Error "======================================================"
              Write-Error "SELECTED SOLUTION PACKAGE NOT FOUND"
              Write-Error "======================================================"

              Write-Error ""
              Write-Error "Solution:"
              Write-Error $env:SOLUTION_NAME

              Write-Error ""
              Write-Error "Deployment type:"
              Write-Error $env:DEPLOYMENT_TYPE

              exit 1
          }


          if ($packages.Count -gt 1) {

              Write-Error ""
              Write-Error "Multiple packages matched the selected solution."

              foreach ($package in $packages) {
                  Write-Error $package.FullName
              }

              exit 1
          }


          $selectedPackage =
            $packages[0].FullName


          Write-Host ""
          Write-Host "Selected package:"
          Write-Host $selectedPackage


          "SOLUTION_PACKAGE=$selectedPackage" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


      # ========================================================
      # 12. LOAD DEPLOYMENT SETTINGS
      # ========================================================

      - name: Load Deployment Settings
        shell: pwsh

        env:

          TARGET_ENVIRONMENT: ${{ inputs.targetEnvironment }}

        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "DEPLOYMENT SETTINGS"
          Write-Host "======================================================"


          $settingsDirectory =
            "./Deployment Settings"


          $settingsFile =
            "$settingsDirectory/ATT-$($env:TARGET_ENVIRONMENT).json"


          Write-Host ""
          Write-Host "Target:"
          Write-Host $env:TARGET_ENVIRONMENT


          Write-Host ""
          Write-Host "Expected settings file:"
          Write-Host $settingsFile


          if (Test-Path $settingsFile) {

              Write-Host ""
              Write-Host "Deployment settings found:"
              Write-Host $settingsFile


              "DEPLOYMENT_SETTINGS_FILE=$settingsFile" |
                Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          }
          else {

              Write-Host ""
              Write-Host "WARNING:"
              Write-Host "Deployment settings file was not found."

              Write-Host ""
              Write-Host "Deployment will continue without deployment settings."


              "DEPLOYMENT_SETTINGS_FILE=" |
                Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append
          }


      # ========================================================
      # 13. PATCH CONNECTOR HOSTS
      # ========================================================

      - name: Patch Connector Hosts
        shell: pwsh

        env:

          TARGET_ENVIRONMENT: ${{ inputs.targetEnvironment }}

        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "PATCH CONNECTOR HOSTS"
          Write-Host "======================================================"


          $script =
            "./PowershellScripts/patch-connector-host.ps1"


          if (Test-Path $script) {

              Write-Host "Running:"
              Write-Host $script


              & $script `
                -Environment $env:TARGET_ENVIRONMENT


              if ($LASTEXITCODE -ne 0) {

                  Write-Error `
                    "Connector host patching failed."

                  exit 1
              }

          }
          else {

              Write-Host ""
              Write-Host `
                "patch-connector-host.ps1 not found."

              Write-Host `
                "Skipping connector host patching."
          }


      # ========================================================
      # 14. RESOLVE CONNECTION REFERENCES
      # ========================================================

      - name: Resolve Connection References
        shell: pwsh

        env:

          TARGET_ENVIRONMENT: ${{ inputs.targetEnvironment }}

        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "RESOLVE CONNECTION REFERENCES"
          Write-Host "======================================================"


          $script =
            "./PowershellScripts/resolve-connrefs.ps1"


          if (Test-Path $script) {

              Write-Host "Running:"
              Write-Host $script


              & $script `
                -Environment $env:TARGET_ENVIRONMENT


              if ($LASTEXITCODE -ne 0) {

                  Write-Error `
                    "Connection reference resolution failed."

                  exit 1
              }

          }
          else {

              Write-Host ""
              Write-Host `
                "resolve-connrefs.ps1 not found."

              Write-Host `
                "Skipping connection reference resolution."
          }


      # ========================================================
      # 15. AUTHENTICATE TO TARGET ENVIRONMENT
      #
      # IMPORTANT:
      # We use repository secrets that already exist:
      #
      # CCAASTRAIL_URL
      # DEV_URL
      # UAT_URL
      # PROD_URL
      #
      # We DO NOT use secrets.ENVIRONMENT_URL anymore.
      # ========================================================

      - name: Authenticate To Target Environment
        shell: pwsh

        env:

          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          TENANT_ID: ${{ secrets.TENANT_ID }}

          CCAASTRAIL_URL: ${{ secrets.CCAASTRAIL_URL }}
          DEV_URL: ${{ secrets.DEV_URL }}
          UAT_URL: ${{ secrets.UAT_URL }}
          PROD_URL: ${{ secrets.PROD_URL }}

          TARGET_ENVIRONMENT: ${{ inputs.targetEnvironment }}

        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "AUTHENTICATING TO TARGET ENVIRONMENT"
          Write-Host "======================================================"


          Write-Host ""
          Write-Host "Target:"
          Write-Host $env:TARGET_ENVIRONMENT


          # ======================================================
          # VALIDATE COMMON SECRETS
          # ======================================================

          if ([string]::IsNullOrWhiteSpace($env:CLIENT_ID)) {

              Write-Error "CLIENT_ID repository secret is missing."

              exit 1
          }


          if ([string]::IsNullOrWhiteSpace($env:CLIENT_SECRET)) {

              Write-Error "CLIENT_SECRET repository secret is missing."

              exit 1
          }


          if ([string]::IsNullOrWhiteSpace($env:TENANT_ID)) {

              Write-Error "TENANT_ID repository secret is missing."

              exit 1
          }


          # ======================================================
          # SELECT TARGET URL
          # ======================================================

          $targetUrl = $null


          switch ($env:TARGET_ENVIRONMENT) {

              "CCaaS" {

                  $targetUrl =
                    $env:CCAASTRAIL_URL

                  Write-Host ""
                  Write-Host "Using CCaaS environment URL."
              }

              "DEV" {

                  $targetUrl =
                    $env:DEV_URL

                  Write-Host ""
                  Write-Host "Using DEV environment URL."
              }

              "UAT" {

                  $targetUrl =
                    $env:UAT_URL

                  Write-Host ""
                  Write-Host "Using UAT environment URL."
              }

              "PROD" {

                  $targetUrl =
                    $env:PROD_URL

                  Write-Host ""
                  Write-Host "Using PROD environment URL."
              }

              default {

                  Write-Error `
                    "Unsupported target environment: $env:TARGET_ENVIRONMENT"

                  exit 1
              }
          }


          # ======================================================
          # VALIDATE SELECTED URL
          # ======================================================

          if ([string]::IsNullOrWhiteSpace($targetUrl)) {

              Write-Error ""
              Write-Error "======================================================"
              Write-Error "TARGET ENVIRONMENT URL IS MISSING"
              Write-Error "======================================================"

              Write-Error ""
              Write-Error "Target Environment:"
              Write-Error $env:TARGET_ENVIRONMENT

              Write-Error ""

              switch ($env:TARGET_ENVIRONMENT) {

                  "CCaaS" {
                      Write-Error "Required repository secret: CCAAstrail_URL"
                  }

                  "DEV" {
                      Write-Error "Required repository secret: DEV_URL"
                  }

                  "UAT" {
                      Write-Error "Required repository secret: UAT_URL"
                  }

                  "PROD" {
                      Write-Error "Required repository secret: PROD_URL"
                  }
              }

              exit 1
          }


          Write-Host ""
          Write-Host "Target URL:"
          Write-Host $targetUrl


          # ======================================================
          # AUTHENTICATE
          # ======================================================

          pac auth create `
            --applicationId "$env:CLIENT_ID" `
            --clientSecret "$env:CLIENT_SECRET" `
            --tenant "$env:TENANT_ID" `
            --environment "$targetUrl"


          if ($LASTEXITCODE -ne 0) {

              Write-Error ""
              Write-Error `
                "Target environment authentication failed."

              exit 1
          }


          # ======================================================
          # SAVE TARGET URL FOR OTHER STEPS
          # ======================================================

          "TARGET_ENVIRONMENT_URL=$targetUrl" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


          Write-Host ""
          Write-Host "======================================================"
          Write-Host "TARGET AUTHENTICATION SUCCESSFUL"
          Write-Host "======================================================"


      # ========================================================
      # 16. VERIFY TARGET AUTHENTICATION
      # ========================================================

      - name: Verify Target Authentication
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "VERIFYING TARGET AUTHENTICATION"
          Write-Host "======================================================"


          pac auth list


          if ($LASTEXITCODE -ne 0) {

              Write-Error `
                "PAC authentication verification failed."

              exit 1
          }


      # ========================================================
      # 17. IMPORT SELECTED SOLUTION
      # ========================================================

      - name: Import Selected Solution
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "IMPORTING SELECTED SOLUTION"
          Write-Host "======================================================"


          if (
            [string]::IsNullOrWhiteSpace(
              $env:SOLUTION_PACKAGE
            )
          ) {

              Write-Error `
                "Solution package path was not found."

              exit 1
          }


          if (-not (Test-Path $env:SOLUTION_PACKAGE)) {

              Write-Error ""
              Write-Error `
                "Solution package does not exist."

              Write-Error $env:SOLUTION_PACKAGE

              exit 1
          }


          Write-Host ""
          Write-Host "Solution:"
          Write-Host "${{ inputs.solutionName }}"


          Write-Host ""
          Write-Host "Package:"
          Write-Host $env:SOLUTION_PACKAGE


          Write-Host ""
          Write-Host "Deployment Type:"
          Write-Host "${{ inputs.deploymentType }}"


          Write-Host ""
          Write-Host "Target:"
          Write-Host "${{ inputs.targetEnvironment }}"


          pac solution import `
            --path "$env:SOLUTION_PACKAGE" `
            --force-overwrite


          if ($LASTEXITCODE -ne 0) {

              Write-Error ""
              Write-Error `
                "Solution import failed."

              Write-Error `
                $env:SOLUTION_PACKAGE

              exit 1
          }


          Write-Host ""
          Write-Host "Solution import successful."


      # ========================================================
      # 18. PUBLISH CUSTOMIZATIONS
      # ========================================================

      - name: Publish Customizations
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "PUBLISHING CUSTOMIZATIONS"
          Write-Host "======================================================"


          pac solution publish


          if ($LASTEXITCODE -ne 0) {

              Write-Error `
                "Publishing customizations failed."

              exit 1
          }


          Write-Host ""
          Write-Host `
            "Customizations published successfully."


      # ========================================================
      # 19. VERIFY PUBLISH
      # ========================================================

      - name: Verify Publish
        shell: pwsh

        env:

          TARGET_ENVIRONMENT: ${{ inputs.targetEnvironment }}

        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "VERIFY PUBLISH"
          Write-Host "======================================================"


          $script =
            "./PowershellScripts/verify-publish.ps1"


          if (Test-Path $script) {

              Write-Host "Running:"
              Write-Host $script


              & $script `
                -Environment $env:TARGET_ENVIRONMENT


              if ($LASTEXITCODE -ne 0) {

                  Write-Error `
                    "Publish verification failed."

                  exit 1
              }

          }
          else {

              Write-Host ""
              Write-Host `
                "verify-publish.ps1 not found."

              Write-Host `
                "Skipping custom verification."
          }


      # ========================================================
      # 20. FIX M2M / CHATBOT RELATIONSHIPS
      # ========================================================

      - name: Fix M2M Links
        shell: pwsh

        env:

          TARGET_ENVIRONMENT: ${{ inputs.targetEnvironment }}

        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "FIXING CHATBOT / M2M RELATIONSHIPS"
          Write-Host "======================================================"


          $script =
            "./PowershellScripts/fix-m2m-links.ps1"


          if (Test-Path $script) {

              Write-Host "Running:"
              Write-Host $script


              & $script `
                -Environment $env:TARGET_ENVIRONMENT


              if ($LASTEXITCODE -ne 0) {

                  Write-Error `
                    "M2M relationship fix failed."

                  exit 1
              }

          }
          else {

              Write-Host ""
              Write-Host `
                "fix-m2m-links.ps1 not found."

              Write-Host `
                "Skipping M2M relationship fix."
          }


      # ========================================================
      # 21. VERIFY PAC FOR COPILOT
      # ========================================================

      - name: Verify PAC For Copilot Publishing
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "VERIFY PAC FOR COPILOT"
          Write-Host "======================================================"


          pac copilot --help


          if ($LASTEXITCODE -ne 0) {

              Write-Host ""
              Write-Host `
                "PAC Copilot command is unavailable."

              Write-Host `
                "Copilot publishing will be skipped."
          }


      # ========================================================
      # 22. PUBLISH COPILOT BOTS
      # ========================================================

      - name: Publish Copilot Bots
        shell: pwsh

        env:

          TARGET_ENVIRONMENT: ${{ inputs.targetEnvironment }}

        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "PUBLISH COPILOT BOTS"
          Write-Host "======================================================"


          $script =
            "./PowershellScripts/publish-bot.ps1"


          if (Test-Path $script) {

              Write-Host "Running:"
              Write-Host $script


              & $script `
                -Environment $env:TARGET_ENVIRONMENT


              if ($LASTEXITCODE -ne 0) {

                  Write-Error `
                    "Copilot bot publishing failed."

                  exit 1
              }


              Write-Host ""
              Write-Host `
                "Copilot publishing completed."

          }
          else {

              Write-Host ""
              Write-Host `
                "publish-bot.ps1 not found."

              Write-Host `
                "Skipping Copilot publishing."
          }


      # ========================================================
      # 23. DEPLOYMENT SUMMARY
      # ========================================================

      - name: Deployment Summary
        if: success()
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host ""
          Write-Host "======================================================"
          Write-Host "ATT DEPLOYMENT SUCCESSFUL"
          Write-Host "======================================================"


          Write-Host ""
          Write-Host "Source Environment:"
          Write-Host "${{ inputs.sourceEnvironment }}"


          Write-Host ""
          Write-Host "Solution:"
          Write-Host "${{ inputs.solutionName }}"


          Write-Host ""
          Write-Host "Export Run:"
          Write-Host $env:EXPORT_RUN_NUMBER


          Write-Host ""
          Write-Host "Export Run ID:"
          Write-Host $env:EXPORT_RUN_ID


          Write-Host ""
          Write-Host "Artifact:"
          Write-Host $env:ARTIFACT_NAME


          Write-Host ""
          Write-Host "Deployment Type:"
          Write-Host "${{ inputs.deploymentType }}"


          Write-Host ""
          Write-Host "Target Environment:"
          Write-Host "${{ inputs.targetEnvironment }}"


          Write-Host ""
          Write-Host "Target URL:"
          Write-Host $env:TARGET_ENVIRONMENT_URL


          Write-Host ""
          Write-Host "======================================================"
          Write-Host "SOURCE → EXPORT → ARTIFACT → TARGET"
          Write-Host "======================================================"


      # ========================================================
      # 24. FAILURE DIAGNOSTICS
      # ========================================================

      - name: Diagnose Deployment Failure
        if: failure()
        shell: pwsh

        env:

          TARGET_ENVIRONMENT: ${{ inputs.targetEnvironment }}

        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "ATT DEPLOYMENT FAILED"
          Write-Host "======================================================"


          Write-Host ""
          Write-Host "Source Environment:"
          Write-Host "${{ inputs.sourceEnvironment }}"


          Write-Host ""
          Write-Host "Solution:"
          Write-Host "${{ inputs.solutionName }}"


          Write-Host ""
          Write-Host "Target Environment:"
          Write-Host "${{ inputs.targetEnvironment }}"


          Write-Host ""
          Write-Host "Deployment Type:"
          Write-Host "${{ inputs.deploymentType }}"


          Write-Host ""
          Write-Host "Export Run:"
          Write-Host "$env:EXPORT_RUN_NUMBER"


          Write-Host ""
          Write-Host "Export Run ID:"
          Write-Host "$env:EXPORT_RUN_ID"


          Write-Host ""
          Write-Host "Artifact:"
          Write-Host "$env:ARTIFACT_NAME"


          $script =
            "./PowershellScripts/diagnose-failure.ps1"


          if (Test-Path $script) {

              Write-Host ""
              Write-Host `
                "Running failure diagnostics:"

              Write-Host $script


              & $script `
                -Environment $env:TARGET_ENVIRONMENT

          }
          else {

              Write-Host ""
              Write-Host `
                "diagnose-failure.ps1 not found."

              Write-Host `
                "No custom ATT diagnostics are available."
          }
