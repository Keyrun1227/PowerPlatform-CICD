name: ATT Import Solution

on:
  workflow_dispatch:
    inputs:

      deploymentType:
        description: "Select deployment type"
        required: true
        type: choice
        options:
          - managed
          - unmanaged

      targetEnvironment:
        description: "Select target environment"
        required: true
        type: choice
        options:
          - TEST
          - UAT
          - PROD


# ============================================================
# PERMISSIONS
# ============================================================

permissions:
  contents: read
  actions: read


# ============================================================
# CONCURRENCY
# Prevent two deployments to the same environment at once.
# ============================================================

concurrency:
  group: att-import-${{ inputs.targetEnvironment }}
  cancel-in-progress: false


jobs:

  # ==========================================================
  # IMPORT / DEPLOYMENT JOB
  # ==========================================================

  import-solution:

    runs-on: windows-latest

    # The GitHub Environment gives us environment-specific
    # secrets and protection rules.
    #
    # Create these GitHub Environments:
    #
    # TEST
    # UAT
    # PROD
    #
    # Each environment should contain:
    #
    # CLIENT_ID
    # CLIENT_SECRET
    # TENANT_ID
    # ENVIRONMENT_URL
    #
    environment:
      name: ${{ inputs.targetEnvironment }}


    steps:

      # ========================================================
      # 1. DISPLAY DEPLOYMENT INPUTS
      # ========================================================

      - name: Display Deployment Information
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "ATT IMPORT / DEPLOYMENT PIPELINE"
          Write-Host "======================================================"

          Write-Host "Deployment Type:"
          Write-Host "${{ inputs.deploymentType }}"

          Write-Host ""
          Write-Host "Target Environment:"
          Write-Host "${{ inputs.targetEnvironment }}"

          Write-Host ""
          Write-Host "IMPORTANT:"
          Write-Host "Build number will be automatically discovered"
          Write-Host "from the latest successful ATT Export Solution run."

          Write-Host "======================================================"


      # ========================================================
      # 2. CHECKOUT REPOSITORY
      # ========================================================

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ========================================================
      # 3. INSTALL .NET
      # ========================================================

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"


      # ========================================================
      # 4. INSTALL POWER PLATFORM CLI
      # ========================================================

      - name: Install Power Platform CLI
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "INSTALLING POWER PLATFORM CLI"
          Write-Host "======================================================"

          dotnet tool install --global Microsoft.PowerApps.CLI.Tool

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Power Platform CLI installation failed."
              exit 1
          }


      # ========================================================
      # 5. ADD PAC TO PATH
      # ========================================================

      - name: Add PAC to PATH
        shell: pwsh
        run: |

          $pacPath = "$env:USERPROFILE\.dotnet\tools"

          Write-Host "PAC path:"
          Write-Host $pacPath

          $pacPath |
            Out-File `
              -FilePath $env:GITHUB_PATH `
              -Encoding utf8 `
              -Append


      # ========================================================
      # 6. VERIFY PAC
      # ========================================================

      - name: Verify PAC Installation
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "VERIFYING PAC CLI"
          Write-Host "======================================================"

          pac help

          if ($LASTEXITCODE -ne 0) {
              Write-Error "PAC CLI verification failed."
              exit 1
          }


      # ========================================================
      # 7. FIND LATEST SUCCESSFUL EXPORT RUN
      #
      # IMPORTANT:
      #
      # The user does NOT select Build102.
      #
      # GitHub automatically searches for:
      #
      # ATT Export Solution
      #       +
      # successful
      #       +
      # latest
      #
      # This is the equivalent of consuming the successful
      # Azure DevOps build artifact.
      # ========================================================

      - name: Find Latest Successful ATT Export
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "SEARCHING FOR LATEST SUCCESSFUL EXPORT"
          Write-Host "======================================================"

          $headers = @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept        = "application/vnd.github+json"
              "X-GitHub-Api-Version" = "2022-11-28"
          }

          $runsUrl =
              "https://api.github.com/repos/$env:REPOSITORY/actions/workflows/export-solution.yml/runs?status=success&per_page=50"

          Write-Host ""
          Write-Host "Export workflow:"
          Write-Host $runsUrl

          try {

              $response = Invoke-RestMethod `
                  -Uri $runsUrl `
                  -Headers $headers `
                  -Method Get

          }
          catch {

              Write-Error "Unable to query GitHub Actions Export workflow."
              Write-Error $_
              exit 1
          }

          if ($null -eq $response.workflow_runs) {
              Write-Error "GitHub returned no workflow runs."
              exit 1
          }

          $successfulRuns =
              @(
                  $response.workflow_runs |
                  Where-Object {
                      $_.conclusion -eq "success"
                  }
              )

          if ($successfulRuns.Count -eq 0) {

              Write-Error ""
              Write-Error "======================================================"
              Write-Error "NO SUCCESSFUL EXPORT FOUND"
              Write-Error "======================================================"
              Write-Error ""
              Write-Error "No successful ATT Export Solution run exists."
              Write-Error "Run ATT Export Solution before starting deployment."
              Write-Error ""

              exit 1
          }

          # GitHub returns newest runs first.
          $latestRun = $successfulRuns |
              Sort-Object created_at -Descending |
              Select-Object -First 1

          $runId = $latestRun.id
          $runNumber = $latestRun.run_number
          $commitSha = $latestRun.head_sha
          $createdAt = $latestRun.created_at

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "LATEST SUCCESSFUL EXPORT FOUND"
          Write-Host "======================================================"

          Write-Host "Workflow:"
          Write-Host "ATT Export Solution"

          Write-Host ""
          Write-Host "Run ID:"
          Write-Host $runId

          Write-Host ""
          Write-Host "Run Number:"
          Write-Host $runNumber

          Write-Host ""
          Write-Host "Commit:"
          Write-Host $commitSha

          Write-Host ""
          Write-Host "Created:"
          Write-Host $createdAt

          Write-Host "======================================================"

          "EXPORT_RUN_ID=$runId" |
              Out-File `
                -FilePath $env:GITHUB_ENV `
                -Encoding utf8 `
                -Append

          "EXPORT_RUN_NUMBER=$runNumber" |
              Out-File `
                -FilePath $env:GITHUB_ENV `
                -Encoding utf8 `
                -Append

          "EXPORT_COMMIT=$commitSha" |
              Out-File `
                -FilePath $env:GITHUB_ENV `
                -Encoding utf8 `
                -Append


      # ========================================================
      # 8. FIND ARTIFACT FROM THAT EXPORT RUN
      # ========================================================

      - name: Find Export Artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "FINDING EXPORT ARTIFACT"
          Write-Host "======================================================"

          $headers = @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept        = "application/vnd.github+json"
              "X-GitHub-Api-Version" = "2022-11-28"
          }

          $artifactsUrl =
              "https://api.github.com/repos/$env:REPOSITORY/actions/runs/$env:EXPORT_RUN_ID/artifacts"

          try {

              $artifactResponse = Invoke-RestMethod `
                  -Uri $artifactsUrl `
                  -Headers $headers `
                  -Method Get

          }
          catch {

              Write-Error "Unable to retrieve artifacts from Export run."
              Write-Error $_
              exit 1
          }

          $artifacts =
              @(
                  $artifactResponse.artifacts |
                  Where-Object {
                      $_.expired -eq $false
                  }
              )

          if ($artifacts.Count -eq 0) {

              Write-Error ""
              Write-Error "No valid artifacts were found for the successful Export run."
              Write-Error "The artifact may have expired or the Export pipeline did not publish one."

              exit 1
          }

          # Prefer the standard ATT artifact name.
          $artifact =
              $artifacts |
              Where-Object {
                  $_.name -like "powerplatform-solutions-*"
              } |
              Select-Object -First 1

          if ($null -eq $artifact) {

              Write-Host "Standard artifact name not found."
              Write-Host "Available artifacts:"

              foreach ($item in $artifacts) {
                  Write-Host " - $($item.name)"
              }

              # Fall back to first valid artifact.
              $artifact = $artifacts | Select-Object -First 1
          }

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "EXPORT ARTIFACT FOUND"
          Write-Host "======================================================"

          Write-Host "Artifact:"
          Write-Host $artifact.name

          Write-Host ""
          Write-Host "Artifact ID:"
          Write-Host $artifact.id

          Write-Host ""
          Write-Host "Size:"
          Write-Host $artifact.size_in_bytes

          Write-Host "======================================================"

          "ARTIFACT_ID=$($artifact.id)" |
              Out-File `
                -FilePath $env:GITHUB_ENV `
                -Encoding utf8 `
                -Append

          "ARTIFACT_NAME=$($artifact.name)" |
              Out-File `
                -FilePath $env:GITHUB_ENV `
                -Encoding utf8 `
                -Append


      # ========================================================
      # 9. DOWNLOAD EXPORT ARTIFACT
      # ========================================================

      - name: Download Export Artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "DOWNLOADING EXPORT ARTIFACT"
          Write-Host "======================================================"

          New-Item `
              -ItemType Directory `
              -Force `
              -Path "./deployment-artifact" |
              Out-Null

          $artifactUrl =
              "https://api.github.com/repos/$env:REPOSITORY/actions/artifacts/$env:ARTIFACT_ID/zip"

          $headers = @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept        = "application/vnd.github+json"
              "X-GitHub-Api-Version" = "2022-11-28"
          }

          $artifactZip =
              "./deployment-artifact/export-artifact.zip"

          try {

              Invoke-WebRequest `
                  -Uri $artifactUrl `
                  -Headers $headers `
                  -OutFile $artifactZip

          }
          catch {

              Write-Error "Failed to download Export artifact."
              Write-Error $_
              exit 1
          }

          if (-not (Test-Path $artifactZip)) {

              Write-Error "Downloaded artifact ZIP was not found."
              exit 1
          }

          Write-Host ""
          Write-Host "Artifact downloaded:"
          Write-Host $artifactZip


      # ========================================================
      # 10. EXTRACT ARTIFACT
      # ========================================================

      - name: Extract Export Artifact
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "EXTRACTING EXPORT ARTIFACT"
          Write-Host "======================================================"

          $extractPath =
              "./deployment-artifact/extracted"

          New-Item `
              -ItemType Directory `
              -Force `
              -Path $extractPath |
              Out-Null

          Expand-Archive `
              -Path "./deployment-artifact/export-artifact.zip" `
              -DestinationPath $extractPath `
              -Force

          Write-Host ""
          Write-Host "Extracted artifact contents:"
          Get-ChildItem `
              -Path $extractPath `
              -Recurse |
              Select-Object FullName


      # ========================================================
      # 11. FIND DEPLOYMENT SOLUTIONS
      #
      # Managed:
      #     *_managed.zip
      #
      # Unmanaged:
      #     *_unmanaged.zip
      #
      # All solutions from the selected successful Export are
      # discovered automatically.
      # ========================================================

      - name: Discover Solution Packages
        shell: pwsh
        env:
          DEPLOYMENT_TYPE: ${{ inputs.deploymentType }}
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "DISCOVERING SOLUTION PACKAGES"
          Write-Host "======================================================"

          $root =
              "./deployment-artifact/extracted"

          if ($env:DEPLOYMENT_TYPE -eq "managed") {

              $pattern = "*_managed.zip"

          }
          else {

              $pattern = "*_unmanaged.zip"

          }

          Write-Host ""
          Write-Host "Deployment type:"
          Write-Host $env:DEPLOYMENT_TYPE

          Write-Host ""
          Write-Host "Search pattern:"
          Write-Host $pattern

          $packages =
              @(
                  Get-ChildItem `
                      -Path $root `
                      -Filter $pattern `
                      -Recurse `
                      -File
              )

          if ($packages.Count -eq 0) {

              Write-Error ""
              Write-Error "======================================================"
              Write-Error "NO SOLUTION PACKAGE FOUND"
              Write-Error "======================================================"
              Write-Error ""
              Write-Error "Deployment type: $env:DEPLOYMENT_TYPE"
              Write-Error "Expected pattern: $pattern"
              Write-Error ""

              exit 1
          }

          Write-Host ""
          Write-Host "Solutions discovered:"
          Write-Host ""

          foreach ($package in $packages) {

              Write-Host "------------------------------------------------------"
              Write-Host $package.FullName
              Write-Host "------------------------------------------------------"
          }

          # Store paths in a text file so later PowerShell steps
          # can process every solution.
          $packageList =
              "./deployment-artifact/solution-packages.txt"

          $packages.FullName |
              Set-Content `
                  -Path $packageList `
                  -Encoding utf8

          "SOLUTION_PACKAGE_LIST=$packageList" |
              Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          Write-Host ""
          Write-Host "Total solution packages:"
          Write-Host $packages.Count


      # ========================================================
      # 12. LOAD DEPLOYMENT SETTINGS
      #
      # Expected repository structure:
      #
      # Deployment Settings/
      #     ATT-Test.json
      #     ATT-UAT.json
      #     ATT-Prod.json
      #
      # The workflow looks for the appropriate file.
      #
      # If it does not exist yet, deployment continues without
      # settings and clearly reports that.
      # ========================================================

      - name: Load Deployment Settings
        shell: pwsh
        env:
          TARGET_ENVIRONMENT: ${{ inputs.targetEnvironment }}
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "DEPLOYMENT SETTINGS"
          Write-Host "======================================================"

          $settingsDirectory =
              "./Deployment Settings"

          $settingsFile = $null

          switch ($env:TARGET_ENVIRONMENT) {

              "TEST" {

                  $settingsFile =
                      "$settingsDirectory/ATT-Test.json"
              }

              "UAT" {

                  $settingsFile =
                      "$settingsDirectory/ATT-UAT.json"
              }

              "PROD" {

                  $settingsFile =
                      "$settingsDirectory/ATT-Prod.json"
              }
          }

          if (Test-Path $settingsFile) {

              Write-Host ""
              Write-Host "Deployment settings found:"
              Write-Host $settingsFile

              "DEPLOYMENT_SETTINGS_FILE=$settingsFile" |
                  Out-File `
                      -FilePath $env:GITHUB_ENV `
                      -Encoding utf8 `
                      -Append

          }
          else {

              Write-Host ""
              Write-Host "WARNING:"
              Write-Host "Deployment settings file was not found:"
              Write-Host $settingsFile

              Write-Host ""
              Write-Host "Deployment will continue without deployment settings."

              "DEPLOYMENT_SETTINGS_FILE=" |
                  Out-File `
                      -FilePath $env:GITHUB_ENV `
                      -Encoding utf8 `
                      -Append
          }


      # ========================================================
      # 13. PATCH CONNECTOR HOSTS
      #
      # ATT capability:
      #
      # patch-connector-host.ps1
      #
      # This is executed only when the script exists.
      # ========================================================

      - name: Patch Connector Hosts
        shell: pwsh
        env:
          TARGET_ENVIRONMENT: ${{ inputs.targetEnvironment }}
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "PATCH CONNECTOR HOSTS"
          Write-Host "======================================================"

          $script =
              "./PowershellScripts/patch-connector-host.ps1"

          if (Test-Path $script) {

              Write-Host "Running:"
              Write-Host $script

              & $script `
                  -Environment $env:TARGET_ENVIRONMENT

              if ($LASTEXITCODE -ne 0) {

                  Write-Error "Connector host patching failed."
                  exit 1
              }

          }
          else {

              Write-Host ""
              Write-Host "patch-connector-host.ps1 not found."
              Write-Host "Skipping connector host patching."
          }


      # ========================================================
      # 14. RESOLVE CONNECTION REFERENCES
      #
      # ATT capability:
      #
      # resolve-connrefs.ps1
      # ========================================================

      - name: Resolve Connection References
        shell: pwsh
        env:
          TARGET_ENVIRONMENT: ${{ inputs.targetEnvironment }}
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "RESOLVE CONNECTION REFERENCES"
          Write-Host "======================================================"

          $script =
              "./PowershellScripts/resolve-connrefs.ps1"

          if (Test-Path $script) {

              Write-Host "Running:"
              Write-Host $script

              & $script `
                  -Environment $env:TARGET_ENVIRONMENT

              if ($LASTEXITCODE -ne 0) {

                  Write-Error "Connection reference resolution failed."
                  exit 1
              }

          }
          else {

              Write-Host ""
              Write-Host "resolve-connrefs.ps1 not found."
              Write-Host "Skipping connection reference resolution."
          }


      # ========================================================
      # 15. AUTHENTICATE TO TARGET ENVIRONMENT
      #
      # GitHub Environment secrets:
      #
      # CLIENT_ID
      # CLIENT_SECRET
      # TENANT_ID
      # ENVIRONMENT_URL
      # ========================================================

      - name: Authenticate to Target Environment
        shell: pwsh
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          TENANT_ID: ${{ secrets.TENANT_ID }}
          ENVIRONMENT_URL: ${{ secrets.ENVIRONMENT_URL }}
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "AUTHENTICATING TO TARGET ENVIRONMENT"
          Write-Host "======================================================"

          Write-Host "Environment:"
          Write-Host "${{ inputs.targetEnvironment }}"

          if ([string]::IsNullOrWhiteSpace($env:CLIENT_ID)) {

              Write-Error "CLIENT_ID GitHub Environment secret is missing."
              exit 1
          }

          if ([string]::IsNullOrWhiteSpace($env:CLIENT_SECRET)) {

              Write-Error "CLIENT_SECRET GitHub Environment secret is missing."
              exit 1
          }

          if ([string]::IsNullOrWhiteSpace($env:TENANT_ID)) {

              Write-Error "TENANT_ID GitHub Environment secret is missing."
              exit 1
          }

          if ([string]::IsNullOrWhiteSpace($env:ENVIRONMENT_URL)) {

              Write-Error "ENVIRONMENT_URL GitHub Environment secret is missing."
              exit 1
          }

          pac auth create `
              --applicationId "$env:CLIENT_ID" `
              --clientSecret "$env:CLIENT_SECRET" `
              --tenant "$env:TENANT_ID" `
              --environment "$env:ENVIRONMENT_URL"

          if ($LASTEXITCODE -ne 0) {

              Write-Error "Target environment authentication failed."
              exit 1
          }


      # ========================================================
      # 16. VERIFY AUTHENTICATION
      # ========================================================

      - name: Verify Target Authentication
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "VERIFYING TARGET AUTHENTICATION"
          Write-Host "======================================================"

          pac auth list


      # ========================================================
      # 17. IMPORT SOLUTIONS
      #
      # Managed:
      #     AccountContactsExport_managed.zip
      #
      # Unmanaged:
      #     AccountContactsExport_unmanaged.zip
      #
      # Every solution package discovered in the artifact is
      # imported.
      # ========================================================

      - name: Import Solutions
        shell: pwsh
        env:
          DEPLOYMENT_TYPE: ${{ inputs.deploymentType }}
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "IMPORTING SOLUTIONS"
          Write-Host "======================================================"

          if (-not (Test-Path $env:SOLUTION_PACKAGE_LIST)) {

              Write-Error "Solution package list was not found."
              exit 1
          }

          $packages =
              Get-Content $env:SOLUTION_PACKAGE_LIST

          foreach ($package in $packages) {

              if ([string]::IsNullOrWhiteSpace($package)) {
                  continue
              }

              Write-Host ""
              Write-Host "------------------------------------------------------"
              Write-Host "IMPORTING:"
              Write-Host $package
              Write-Host "------------------------------------------------------"

              pac solution import `
                  --path "$package" `
                  --force-overwrite

              if ($LASTEXITCODE -ne 0) {

                  Write-Error ""
                  Write-Error "Solution import failed:"
                  Write-Error $package

                  exit 1
              }

              Write-Host ""
              Write-Host "Import successful:"
              Write-Host $package
          }


      # ========================================================
      # 18. PUBLISH CUSTOMIZATIONS
      # ========================================================

      - name: Publish Customizations
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "PUBLISHING CUSTOMIZATIONS"
          Write-Host "======================================================"

          pac solution publish

          if ($LASTEXITCODE -ne 0) {

              Write-Error "Publishing customizations failed."
              exit 1
          }

          Write-Host ""
          Write-Host "Customizations published successfully."


      # ========================================================
      # 19. VERIFY PUBLISH
      #
      # ATT capability:
      #
      # verify-publish.ps1
      # ========================================================

      - name: Verify Publish
        shell: pwsh
        env:
          TARGET_ENVIRONMENT: ${{ inputs.targetEnvironment }}
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "VERIFY PUBLISH"
          Write-Host "======================================================"

          $script =
              "./PowershellScripts/verify-publish.ps1"

          if (Test-Path $script) {

              Write-Host "Running:"
              Write-Host $script

              & $script `
                  -Environment $env:TARGET_ENVIRONMENT

              if ($LASTEXITCODE -ne 0) {

                  Write-Error "Publish verification failed."
                  exit 1
              }

          }
          else {

              Write-Host ""
              Write-Host "verify-publish.ps1 not found."
              Write-Host "Skipping custom verification."
          }


      # ========================================================
      # 20. FIX MANY-TO-MANY / CHATBOT RELATIONSHIPS
      #
      # ATT capability:
      #
      # fix-m2m-links.ps1
      # ========================================================

      - name: Fix M2M Links
        shell: pwsh
        env:
          TARGET_ENVIRONMENT: ${{ inputs.targetEnvironment }}
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "FIXING CHATBOT / M2M RELATIONSHIPS"
          Write-Host "======================================================"

          $script =
              "./PowershellScripts/fix-m2m-links.ps1"

          if (Test-Path $script) {

              Write-Host "Running:"
              Write-Host $script

              & $script `
                  -Environment $env:TARGET_ENVIRONMENT

              if ($LASTEXITCODE -ne 0) {

                  Write-Error "M2M relationship fix failed."
                  exit 1
              }

          }
          else {

              Write-Host ""
              Write-Host "fix-m2m-links.ps1 not found."
              Write-Host "Skipping M2M relationship fix."
          }


      # ========================================================
      # 21. INSTALL / VERIFY PAC FOR COPILOT PUBLISH
      #
      # PAC is already installed, so this step only verifies it.
      # ========================================================

      - name: Verify PAC For Copilot Publishing
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "VERIFY PAC FOR COPILOT"
          Write-Host "======================================================"

          pac copilot --help

          if ($LASTEXITCODE -ne 0) {

              Write-Host ""
              Write-Host "PAC Copilot command is unavailable."
              Write-Host "Copilot publishing will be skipped unless"
              Write-Host "the required PAC command is available."
          }


      # ========================================================
      # 22. PUBLISH COPILOT BOTS
      #
      # ATT capability:
      #
      # publish-bot.ps1
      #
      # If the script exists, execute it.
      # ========================================================

      - name: Publish Copilot Bots
        shell: pwsh
        env:
          TARGET_ENVIRONMENT: ${{ inputs.targetEnvironment }}
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "PUBLISH COPILOT BOTS"
          Write-Host "======================================================"

          $script =
              "./PowershellScripts/publish-bot.ps1"

          if (Test-Path $script) {

              Write-Host "Running:"
              Write-Host $script

              & $script `
                  -Environment $env:TARGET_ENVIRONMENT

              if ($LASTEXITCODE -ne 0) {

                  Write-Error "Copilot bot publishing failed."
                  exit 1
              }

              Write-Host ""
              Write-Host "Copilot publishing completed."

          }
          else {

              Write-Host ""
              Write-Host "publish-bot.ps1 not found."
              Write-Host "Skipping Copilot publishing."
          }


      # ========================================================
      # 23. DEPLOYMENT SUMMARY
      # ========================================================

      - name: Deployment Summary
        if: success()
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host ""
          Write-Host "======================================================"
          Write-Host "ATT DEPLOYMENT SUCCESSFUL"
          Write-Host "======================================================"

          Write-Host ""
          Write-Host "Export Run:"
          Write-Host $env:EXPORT_RUN_NUMBER

          Write-Host ""
          Write-Host "Export Run ID:"
          Write-Host $env:EXPORT_RUN_ID

          Write-Host ""
          Write-Host "Artifact:"
          Write-Host $env:ARTIFACT_NAME

          Write-Host ""
          Write-Host "Deployment Type:"
          Write-Host "${{ inputs.deploymentType }}"

          Write-Host ""
          Write-Host "Target Environment:"
          Write-Host "${{ inputs.targetEnvironment }}"

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "DEV → EXPORT → ARTIFACT → DEPLOYMENT"
          Write-Host "======================================================"


      # ========================================================
      # 24. FAILURE DIAGNOSTICS
      #
      # ATT capability:
      #
      # diagnose-failure.ps1
      #
      # Runs only when deployment fails.
      # ========================================================

      - name: Diagnose Deployment Failure
        if: failure()
        shell: pwsh
        env:
          TARGET_ENVIRONMENT: ${{ inputs.targetEnvironment }}
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "ATT DEPLOYMENT FAILED"
          Write-Host "======================================================"

          Write-Host ""
          Write-Host "Target Environment:"
          Write-Host "${{ inputs.targetEnvironment }}"

          Write-Host ""
          Write-Host "Deployment Type:"
          Write-Host "${{ inputs.deploymentType }}"

          Write-Host ""
          Write-Host "Export Run:"
          Write-Host "$env:EXPORT_RUN_NUMBER"

          $script =
              "./PowershellScripts/diagnose-failure.ps1"

          if (Test-Path $script) {

              Write-Host ""
              Write-Host "Running failure diagnostics:"
              Write-Host $script

              & $script `
                  -Environment $env:TARGET_ENVIRONMENT

          }
          else {

              Write-Host ""
              Write-Host "diagnose-failure.ps1 not found."
              Write-Host "No custom ATT diagnostics are available."
          }