name: ATT Export Solution

on:
  workflow_dispatch:
    inputs:

      sourceEnvironment:
        description: "Select source environment"
        required: true
        type: choice
        options:
          - CCaaS
          - DEV
          - UAT
          - PROD

      solutionNames:
        description: "Enter solution name(s), comma separated"
        required: true
        type: string

      updateVersion:
        description: "Update Power Platform solution version?"
        required: true
        type: boolean
        default: false


# ============================================================
# PERMISSIONS
# ============================================================

permissions:
  contents: write
  actions: read


# ============================================================
# CONCURRENCY
# ============================================================

concurrency:
  group: att-export-${{ inputs.sourceEnvironment }}
  cancel-in-progress: false


# ============================================================
# JOB
# ============================================================

jobs:

  export-solution:

    runs-on: windows-latest

    steps:

      # ========================================================
      # 1. CHECKOUT REPOSITORY
      # ========================================================

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0


      # ========================================================
      # 2. DISPLAY PIPELINE INPUTS
      # ========================================================

      - name: Display Pipeline Inputs
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "ATT EXPORT PIPELINE"
          Write-Host "============================================================"

          Write-Host ""
          Write-Host "Source Environment:"
          Write-Host "${{ inputs.sourceEnvironment }}"

          Write-Host ""
          Write-Host "Solution(s):"
          Write-Host "${{ inputs.solutionNames }}"

          Write-Host ""
          Write-Host "Update Version:"
          Write-Host "${{ inputs.updateVersion }}"

          Write-Host ""
          Write-Host "============================================================"


      # ========================================================
      # 3. INSTALL .NET
      # ========================================================

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"


      # ========================================================
      # 4. INSTALL POWER PLATFORM CLI
      # ========================================================

      - name: Install Power Platform CLI
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "INSTALLING POWER PLATFORM CLI"
          Write-Host "============================================================"

          dotnet tool install --global Microsoft.PowerApps.CLI.Tool

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Power Platform CLI installation failed."
              exit 1
          }


      # ========================================================
      # 5. ADD PAC TO PATH
      # ========================================================

      - name: Add PAC To PATH
        shell: pwsh
        run: |

          $pacPath = "$env:USERPROFILE\.dotnet\tools"

          Write-Host ""
          Write-Host "PAC path:"
          Write-Host $pacPath

          $pacPath |
            Out-File `
              -FilePath $env:GITHUB_PATH `
              -Encoding utf8 `
              -Append


      # ========================================================
      # 6. VERIFY PAC
      # ========================================================

      - name: Verify PAC Installation
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFYING PAC CLI"
          Write-Host "============================================================"

          pac help

          if ($LASTEXITCODE -ne 0) {
              Write-Error "PAC CLI verification failed."
              exit 1
          }


      # ========================================================
      # 7. READ AND INCREMENT BUILD NUMBER
      # ========================================================

      - name: Read And Increment Build Number
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "BUILD NUMBER MANAGEMENT"
          Write-Host "============================================================"

          $buildFile = "./build.txt"

          if (-not (Test-Path $buildFile)) {

              Write-Host "build.txt not found."
              Write-Host "Starting from Build100."

              $currentBuild = 100

          }
          else {

              $content = (Get-Content $buildFile -Raw).Trim()

              Write-Host "Current build:"
              Write-Host $content

              if ($content -match "^Build(\d+)$") {

                  $currentBuild = [int]$Matches[1]

              }
              else {

                  Write-Error "Invalid build.txt format."
                  Write-Error "Expected format: Build100"
                  exit 1
              }
          }

          $newBuildNumber = $currentBuild + 1
          $buildVersion = "Build$newBuildNumber"

          Set-Content `
            -Path $buildFile `
            -Value $buildVersion `
            -Encoding utf8

          Write-Host ""
          Write-Host "Previous Build : Build$currentBuild"
          Write-Host "New Build      : $buildVersion"

          "BUILD_VERSION=$buildVersion" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


      # ========================================================
      # 8. AUTHENTICATE TO SELECTED SOURCE ENVIRONMENT
      #
      # Repository secrets:
      #
      # CLIENT_ID
      # CLIENT_SECRET
      # TENANT_ID
      # CCAASTRAIL_URL
      # DEV_URL
      # UAT_URL
      # PROD_URL
      #
      # The selected source environment determines which URL
      # is used.
      # ========================================================

      - name: Authenticate To Source Environment
        shell: pwsh
        env:

          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          TENANT_ID: ${{ secrets.TENANT_ID }}

          CCAAS_URL: ${{ secrets.CCAASTRAIL_URL }}
          DEV_URL: ${{ secrets.DEV_URL }}
          UAT_URL: ${{ secrets.UAT_URL }}
          PROD_URL: ${{ secrets.PROD_URL }}

          SOURCE_ENVIRONMENT: ${{ inputs.sourceEnvironment }}

        run: |

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "AUTHENTICATING TO SOURCE ENVIRONMENT"
          Write-Host "============================================================"

          Write-Host ""
          Write-Host "Selected Source Environment:"
          Write-Host $env:SOURCE_ENVIRONMENT


          # ----------------------------------------------------
          # Validate common credentials
          # ----------------------------------------------------

          if ([string]::IsNullOrWhiteSpace($env:CLIENT_ID)) {

              Write-Error "CLIENT_ID secret is missing."
              exit 1
          }


          if ([string]::IsNullOrWhiteSpace($env:CLIENT_SECRET)) {

              Write-Error "CLIENT_SECRET secret is missing."
              exit 1
          }


          if ([string]::IsNullOrWhiteSpace($env:TENANT_ID)) {

              Write-Error "TENANT_ID secret is missing."
              exit 1
          }


          # ----------------------------------------------------
          # Select environment URL dynamically
          # ----------------------------------------------------

          $environmentUrl = $null

          switch ($env:SOURCE_ENVIRONMENT) {

              "CCaaS" {

                  Write-Host ""
                  Write-Host "Environment selected: CCaaS"
                  Write-Host "Using CCAASTRAIL_URL"

                  $environmentUrl = $env:CCAAS_URL
              }

              "DEV" {

                  Write-Host ""
                  Write-Host "Environment selected: DEV"
                  Write-Host "Using DEV_URL"

                  $environmentUrl = $env:DEV_URL
              }

              "UAT" {

                  Write-Host ""
                  Write-Host "Environment selected: UAT"
                  Write-Host "Using UAT_URL"

                  $environmentUrl = $env:UAT_URL
              }

              "PROD" {

                  Write-Host ""
                  Write-Host "Environment selected: PROD"
                  Write-Host "Using PROD_URL"

                  $environmentUrl = $env:PROD_URL
              }

              default {

                  Write-Error ""
                  Write-Error "============================================================"
                  Write-Error "INVALID SOURCE ENVIRONMENT"
                  Write-Error "============================================================"

                  Write-Error "Unknown environment:"
                  Write-Error $env:SOURCE_ENVIRONMENT

                  exit 1
              }
          }


          # ----------------------------------------------------
          # Validate selected URL
          # ----------------------------------------------------

          if ([string]::IsNullOrWhiteSpace($environmentUrl)) {

              Write-Error ""
              Write-Error "============================================================"
              Write-Error "ENVIRONMENT URL SECRET IS MISSING"
              Write-Error "============================================================"

              Write-Error ""
              Write-Error "Selected environment:"
              Write-Error $env:SOURCE_ENVIRONMENT

              Write-Error ""
              Write-Error "Make sure the corresponding repository secret exists."

              Write-Error ""
              Write-Error "Expected secrets:"

              Write-Error "CCaaS -> CCAASTRAIL_URL"
              Write-Error "DEV   -> DEV_URL"
              Write-Error "UAT   -> UAT_URL"
              Write-Error "PROD  -> PROD_URL"

              exit 1
          }


          # ----------------------------------------------------
          # Store URL for later steps
          #
          # We do NOT print the URL to avoid unnecessary exposure.
          # ----------------------------------------------------

          "SOURCE_ENVIRONMENT_URL=$environmentUrl" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


          Write-Host ""
          Write-Host "Environment URL selected successfully."


          # ----------------------------------------------------
          # PAC AUTHENTICATION
          # ----------------------------------------------------

          Write-Host ""
          Write-Host "Connecting to selected Power Platform environment..."

          pac auth create `
            --applicationId "$env:CLIENT_ID" `
            --clientSecret "$env:CLIENT_SECRET" `
            --tenant "$env:TENANT_ID" `
            --environment "$environmentUrl"


          if ($LASTEXITCODE -ne 0) {

              Write-Error ""
              Write-Error "============================================================"
              Write-Error "SOURCE ENVIRONMENT AUTHENTICATION FAILED"
              Write-Error "============================================================"

              Write-Error ""
              Write-Error "Environment:"
              Write-Error $env:SOURCE_ENVIRONMENT

              exit 1
          }


          Write-Host ""
          Write-Host "Source environment authentication successful."


      # ========================================================
      # 9. VERIFY AUTHENTICATION
      # ========================================================

      - name: Verify Source Authentication
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFYING SOURCE AUTHENTICATION"
          Write-Host "============================================================"

          pac auth list

          if ($LASTEXITCODE -ne 0) {

              Write-Error "PAC authentication verification failed."
              exit 1
          }


      # ========================================================
      # 10. PREPARE DIRECTORIES
      # ========================================================

      - name: Prepare Build Directories
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "PREPARING BUILD DIRECTORIES"
          Write-Host "============================================================"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "./src/solutions" |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "./deployments/$env:BUILD_VERSION" |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "./checker-results/$env:BUILD_VERSION" |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "./temp/$env:BUILD_VERSION" |
            Out-Null

          Write-Host ""
          Write-Host "Directories prepared."


      # ========================================================
      # 11. PROCESS SELECTED SOLUTIONS
      # ========================================================

      - name: Export And Validate Solutions
        shell: pwsh
        env:

          SOLUTION_NAMES: ${{ inputs.solutionNames }}

          UPDATE_VERSION: ${{ inputs.updateVersion }}

          SOURCE_ENVIRONMENT: ${{ inputs.sourceEnvironment }}

        run: |

          $solutions = $env:SOLUTION_NAMES -split ','


          foreach ($solution in $solutions) {

              $solution = $solution.Trim()


              if ([string]::IsNullOrWhiteSpace($solution)) {
                  continue
              }


              Write-Host ""
              Write-Host ""
              Write-Host "############################################################"
              Write-Host "PROCESSING SOLUTION"
              Write-Host "############################################################"

              Write-Host ""
              Write-Host "Solution : $solution"
              Write-Host "Source   : $env:SOURCE_ENVIRONMENT"
              Write-Host "Build    : $env:BUILD_VERSION"

              Write-Host ""
              Write-Host "############################################################"


              # ==================================================
              # PATHS
              # ==================================================

              $sourcePath =
                "./src/solutions/$solution"

              $buildPath =
                "./temp/$env:BUILD_VERSION/$solution"

              $managedPath =
                "./deployments/$env:BUILD_VERSION/${solution}_managed.zip"

              $unmanagedPath =
                "./deployments/$env:BUILD_VERSION/${solution}_unmanaged.zip"

              $checkerPath =
                "./checker-results/$env:BUILD_VERSION/$solution"


              New-Item `
                -ItemType Directory `
                -Force `
                -Path $buildPath |
                Out-Null


              New-Item `
                -ItemType Directory `
                -Force `
                -Path $checkerPath |
                Out-Null


              # ==================================================
              # READ CURRENT SOLUTION VERSION
              # ==================================================

              Write-Host ""
              Write-Host "============================================================"
              Write-Host "READING CURRENT SOLUTION VERSION"
              Write-Host "============================================================"

              $versionOutput =
                pac solution online-version `
                  --solution-name "$solution"


              if ($LASTEXITCODE -ne 0) {

                  Write-Error ""
                  Write-Error "Unable to read version for:"
                  Write-Error $solution

                  exit 1
              }


              Write-Host ""
              Write-Host "PAC version response:"
              Write-Host $versionOutput


              # ==================================================
              # PARSE VERSION
              # ==================================================

              $versionText =
                ($versionOutput | Out-String).Trim()


              $versionMatch =
                [regex]::Match(
                    $versionText,
                    "\d+\.\d+\.\d+(?:\.\d+)?"
                )


              if (-not $versionMatch.Success) {

                  Write-Error ""
                  Write-Error "Could not determine solution version for:"
                  Write-Error $solution

                  exit 1
              }


              $currentVersion =
                $versionMatch.Value


              Write-Host ""
              Write-Host "Current Version:"
              Write-Host $currentVersion


              # ==================================================
              # OPTIONAL VERSION UPDATE
              # ==================================================

              if ($env:UPDATE_VERSION -eq "true") {

                  Write-Host ""
                  Write-Host "============================================================"
                  Write-Host "UPDATING SOLUTION VERSION"
                  Write-Host "============================================================"


                  $parts =
                    $currentVersion.Split(".")


                  if ($parts.Count -eq 3) {

                      $currentVersion =
                        "$currentVersion.0"
                  }


                  $parts =
                    $currentVersion.Split(".")


                  $major =
                    [int]$parts[0]

                  $minor =
                    [int]$parts[1]

                  $build =
                    [int]$parts[2]

                  $revision =
                    [int]$parts[3]


                  $newRevision =
                    $revision + 1


                  $newVersion =
                    "$major.$minor.$build.$newRevision"


                  Write-Host ""
                  Write-Host "Old Version : $currentVersion"
                  Write-Host "New Version : $newVersion"


                  pac solution online-version `
                    --solution-name "$solution" `
                    --solution-version "$newVersion"


                  if ($LASTEXITCODE -ne 0) {

                      Write-Error ""
                      Write-Error "Failed to update version for:"
                      Write-Error $solution

                      exit 1
                  }


                  Write-Host ""
                  Write-Host "Solution version updated successfully."

              }
              else {

                  Write-Host ""
                  Write-Host "Solution version update disabled."


                  if (
                    $currentVersion.Split(".").Count -eq 3
                  ) {

                      $newVersion =
                        "$currentVersion.0"

                  }
                  else {

                      $newVersion =
                        $currentVersion
                  }
              }


              # ==================================================
              # EXPORT UNMANAGED
              # ==================================================

              Write-Host ""
              Write-Host "============================================================"
              Write-Host "EXPORTING UNMANAGED SOLUTION"
              Write-Host "============================================================"


              pac solution export `
                --name "$solution" `
                --path "$unmanagedPath"


              if ($LASTEXITCODE -ne 0) {

                  Write-Error ""
                  Write-Error "Unmanaged export failed for:"
                  Write-Error $solution

                  exit 1
              }


              Write-Host ""
              Write-Host "Unmanaged export completed."


              # ==================================================
              # EXPORT MANAGED
              # ==================================================

              Write-Host ""
              Write-Host "============================================================"
              Write-Host "EXPORTING MANAGED SOLUTION"
              Write-Host "============================================================"


              pac solution export `
                --name "$solution" `
                --path "$managedPath" `
                --managed


              if ($LASTEXITCODE -ne 0) {

                  Write-Error ""
                  Write-Error "Managed export failed for:"
                  Write-Error $solution

                  exit 1
              }


              Write-Host ""
              Write-Host "Managed export completed."


              # ==================================================
              # SOLUTION CHECKER
              # ==================================================

              Write-Host ""
              Write-Host "============================================================"
              Write-Host "RUNNING SOLUTION CHECKER"
              Write-Host "============================================================"


              pac solution check `
                --path "$unmanagedPath" `
                --outputDirectory "$checkerPath"


              if ($LASTEXITCODE -ne 0) {

                  Write-Error ""
                  Write-Error "Solution Checker failed for:"
                  Write-Error $solution

                  exit 1
              }


              Write-Host ""
              Write-Host "Solution Checker completed."


              # ==================================================
              # REMOVE OLD SOURCE
              # ==================================================

              if (Test-Path $sourcePath) {

                  Write-Host ""
                  Write-Host "Removing previous unpacked source..."

                  Remove-Item `
                    -Path $sourcePath `
                    -Recurse `
                    -Force
              }


              # ==================================================
              # UNPACK UNMANAGED SOLUTION
              # ==================================================

              Write-Host ""
              Write-Host "============================================================"
              Write-Host "UNPACKING UNMANAGED SOLUTION"
              Write-Host "============================================================"


              New-Item `
                -ItemType Directory `
                -Force `
                -Path $sourcePath |
                Out-Null


              pac solution unpack `
                --zipfile "$unmanagedPath" `
                --folder "$sourcePath"


              if ($LASTEXITCODE -ne 0) {

                  Write-Error ""
                  Write-Error "Solution unpack failed for:"
                  Write-Error $solution

                  exit 1
              }


              Write-Host ""
              Write-Host "Solution unpack completed."


              # ==================================================
              # CREATE BUILD INFORMATION
              # ==================================================

              Write-Host ""
              Write-Host "Creating build information..."


              $versionInfo =
                "Solution Name : $solution`n" +
                "Source Env    : $env:SOURCE_ENVIRONMENT`n" +
                "Build         : $env:BUILD_VERSION`n" +
                "Version       : $newVersion`n" +
                "Managed ZIP   : ${solution}_managed.zip`n" +
                "Unmanaged ZIP : ${solution}_unmanaged.zip"


              Set-Content `
                -Path "$sourcePath/build-info.txt" `
                -Value $versionInfo `
                -Encoding utf8


              # ==================================================
              # PACK SOURCE FOR VALIDATION
              # ==================================================

              Write-Host ""
              Write-Host "============================================================"
              Write-Host "PACKING SOURCE FOR VALIDATION"
              Write-Host "============================================================"


              $validationZip =
                "$buildPath/${solution}_validation.zip"


              pac solution pack `
                --folder "$sourcePath" `
                --zipfile "$validationZip" `
                --packagetype Unmanaged


              if ($LASTEXITCODE -ne 0) {

                  Write-Error ""
                  Write-Error "Solution pack failed for:"
                  Write-Error $solution

                  exit 1
              }


              Write-Host ""
              Write-Host "Validation package created."


              # ==================================================
              # SOLUTION SUMMARY
              # ==================================================

              Write-Host ""
              Write-Host "============================================================"
              Write-Host "SOLUTION COMPLETED"
              Write-Host "============================================================"

              Write-Host ""
              Write-Host "Solution:"
              Write-Host $solution

              Write-Host ""
              Write-Host "Source:"
              Write-Host $env:SOURCE_ENVIRONMENT

              Write-Host ""
              Write-Host "Version:"
              Write-Host $newVersion

              Write-Host ""
              Write-Host "Managed:"
              Write-Host $managedPath

              Write-Host ""
              Write-Host "Unmanaged:"
              Write-Host $unmanagedPath

              Write-Host ""
              Write-Host "Source:"
              Write-Host $sourcePath

              Write-Host ""
              Write-Host "============================================================"
          }


      # ========================================================
      # 12. CREATE EXPORT METADATA
      # ========================================================

      - name: Create Export Metadata
        shell: pwsh
        env:

          SOURCE_ENVIRONMENT: ${{ inputs.sourceEnvironment }}

          SOLUTION_NAMES: ${{ inputs.solutionNames }}

          UPDATE_VERSION: ${{ inputs.updateVersion }}

        run: |

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "CREATING EXPORT METADATA"
          Write-Host "============================================================"


          $metadata = [ordered]@{

              sourceEnvironment = $env:SOURCE_ENVIRONMENT

              solutionNames = @(
                  $env:SOLUTION_NAMES -split ',' |
                  ForEach-Object {
                      $_.Trim()
                  } |
                  Where-Object {
                      -not [string]::IsNullOrWhiteSpace($_)
                  }
              )

              build =
                $env:BUILD_VERSION

              updateVersion =
                $env:UPDATE_VERSION

              exportedAt =
                (Get-Date).ToUniversalTime().ToString("o")

              workflow =
                "ATT Export Solution"

              repository =
                "${{ github.repository }}"

              commit =
                "${{ github.sha }}"
          }


          $metadataDirectory =
            "./deployments/$env:BUILD_VERSION"


          $metadataPath =
            "$metadataDirectory/export-metadata.json"


          $metadata |
            ConvertTo-Json -Depth 10 |
            Set-Content `
              -Path $metadataPath `
              -Encoding utf8


          Write-Host ""
          Write-Host "Metadata created:"
          Write-Host $metadataPath


          Get-Content $metadataPath


      # ========================================================
      # 13. DISPLAY GENERATED FILES
      # ========================================================

      - name: Display Generated Files
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "GENERATED FILES"
          Write-Host "============================================================"


          Write-Host ""
          Write-Host "SOURCE FILES"


          if (Test-Path "./src") {

              Get-ChildItem `
                -Path "./src" `
                -Recurse |
                Select-Object FullName
          }


          Write-Host ""
          Write-Host "DEPLOYMENT PACKAGES"


          if (Test-Path "./deployments") {

              Get-ChildItem `
                -Path "./deployments" `
                -Recurse |
                Select-Object FullName
          }


          Write-Host ""
          Write-Host "SOLUTION CHECKER RESULTS"


          if (Test-Path "./checker-results") {

              Get-ChildItem `
                -Path "./checker-results" `
                -Recurse |
                Select-Object FullName
          }


      # ========================================================
      # 14. COMMIT BUILD TO GITHUB
      # ========================================================

      - name: Commit Build To Repository
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "COMMITTING BUILD TO GITHUB"
          Write-Host "============================================================"


          git config user.name "github-actions[bot]"

          git config user.email `
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add build.txt

          git add src/

          git add deployments/

          git add checker-results/


          Write-Host ""
          Write-Host "Git status:"

          git status


          git diff --cached --quiet


          if ($LASTEXITCODE -eq 0) {

              Write-Host ""
              Write-Host "No repository changes detected."

          }
          else {

              Write-Host ""
              Write-Host "Creating commit..."


              git commit `
                -m "ATT Export $env:BUILD_VERSION - ${{ inputs.sourceEnvironment }}"


              if ($LASTEXITCODE -ne 0) {

                  Write-Error "Git commit failed."
                  exit 1
              }


              Write-Host ""
              Write-Host "Pushing changes to main..."


              git push origin HEAD:main


              if ($LASTEXITCODE -ne 0) {

                  Write-Error "Git push failed."
                  exit 1
              }


              Write-Host ""
              Write-Host "Build committed successfully."
          }


      # ========================================================
      # 15. CREATE GITHUB ARTIFACT
      # ========================================================

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:

          name: powerplatform-solutions-${{ inputs.sourceEnvironment }}-${{ env.BUILD_VERSION }}

          path: |
            ./deployments/${{ env.BUILD_VERSION }}
            ./checker-results/${{ env.BUILD_VERSION }}

          if-no-files-found: error


      # ========================================================
      # 16. FINAL SUMMARY
      # ========================================================

      - name: Build Summary
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "ATT EXPORT PIPELINE COMPLETED SUCCESSFULLY"
          Write-Host "============================================================"


          Write-Host ""
          Write-Host "Source Environment:"
          Write-Host "${{ inputs.sourceEnvironment }}"


          Write-Host ""
          Write-Host "Build:"
          Write-Host $env:BUILD_VERSION


          Write-Host ""
          Write-Host "Solutions:"
          Write-Host "${{ inputs.solutionNames }}"


          Write-Host ""
          Write-Host "Version Update:"
          Write-Host "${{ inputs.updateVersion }}"


          Write-Host ""
          Write-Host "Artifact:"
          Write-Host "powerplatform-solutions-${{ inputs.sourceEnvironment }}-$env:BUILD_VERSION"


          Write-Host ""
          Write-Host "============================================================"

          Write-Host ""
          Write-Host "EXPORT FLOW:"
          Write-Host ""
          Write-Host "${{ inputs.sourceEnvironment }}"
          Write-Host "      |"
          Write-Host "      v"
          Write-Host "Selected Environment URL"
          Write-Host "      |"
          Write-Host "      v"
          Write-Host "PAC Authentication"
          Write-Host "      |"
          Write-Host "      v"
          Write-Host "Solution Export"
          Write-Host "      |"
          Write-Host "      v"
          Write-Host "Managed + Unmanaged ZIP"
          Write-Host "      |"
          Write-Host "      v"
          Write-Host "Solution Checker"
          Write-Host "      |"
          Write-Host "      v"
          Write-Host "GitHub Artifact"

          Write-Host ""
          Write-Host "============================================================"
