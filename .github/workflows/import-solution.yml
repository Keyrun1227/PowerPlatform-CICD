name: ATT Import Solution

on:
  workflow_dispatch:
    inputs:

      sourceEnvironment:
        description: "Select source environment"
        required: true
        type: choice
        options:
          - CCaaS
          - DEV
          - UAT
          - PROD

      solutionName:
        description: "Enter exact solution name to deploy"
        required: true
        type: string

      deploymentType:
        description: "Select deployment type"
        required: true
        type: choice
        options:
          - managed
          - unmanaged

      targetEnvironment:
        description: "Select target environment"
        required: true
        type: choice
        options:
          - CCaaS
          - DEV
          - UAT
          - PROD


permissions:
  contents: read
  actions: read


concurrency:
  group: att-import-${{ inputs.targetEnvironment }}
  cancel-in-progress: false


jobs:

  import-solution:

    runs-on: windows-latest

    steps:

      # ============================================================
      # 1. DISPLAY DEPLOYMENT INFORMATION
      # ============================================================

      - name: Display Deployment Information
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "ATT IMPORT / DEPLOYMENT PIPELINE"
          Write-Host "======================================================"

          Write-Host ""
          Write-Host "Source Environment:"
          Write-Host "${{ inputs.sourceEnvironment }}"

          Write-Host ""
          Write-Host "Solution:"
          Write-Host "${{ inputs.solutionName }}"

          Write-Host ""
          Write-Host "Target Environment:"
          Write-Host "${{ inputs.targetEnvironment }}"

          Write-Host ""
          Write-Host "Deployment Type:"
          Write-Host "${{ inputs.deploymentType }}"

          Write-Host ""
          Write-Host "======================================================"


      # ============================================================
      # 2. CHECKOUT REPOSITORY
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ============================================================
      # 3. INSTALL .NET
      # ============================================================

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"


      # ============================================================
      # 4. INSTALL POWER PLATFORM CLI
      # ============================================================

      - name: Install Power Platform CLI
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "INSTALLING POWER PLATFORM CLI"
          Write-Host "======================================================"

          dotnet tool install --global Microsoft.PowerApps.CLI.Tool

          if ($LASTEXITCODE -ne 0) {

              Write-Error "Power Platform CLI installation failed."
              exit 1
          }

          Write-Host ""
          Write-Host "Power Platform CLI installed successfully."


      # ============================================================
      # 5. ADD PAC TO PATH
      # ============================================================

      - name: Add PAC To PATH
        shell: pwsh
        run: |

          $pacPath = "$env:USERPROFILE\.dotnet\tools"

          Write-Host ""
          Write-Host "PAC path:"
          Write-Host $pacPath

          $pacPath |
            Out-File `
              -FilePath $env:GITHUB_PATH `
              -Encoding utf8 `
              -Append


      # ============================================================
      # 6. VERIFY PAC
      # ============================================================

      - name: Verify PAC Installation
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "VERIFYING PAC CLI"
          Write-Host "======================================================"

          pac help

          if ($LASTEXITCODE -ne 0) {

              Write-Error "PAC CLI verification failed."
              exit 1
          }

          Write-Host ""
          Write-Host "PAC CLI is available."


      # ============================================================
      # 7. FIND MATCHING SUCCESSFUL EXPORT
      # ============================================================

      - name: Find Matching Successful Export
        shell: pwsh

        env:

          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}

          SOURCE_ENVIRONMENT: ${{ inputs.sourceEnvironment }}
          SOLUTION_NAME: ${{ inputs.solutionName }}

        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "SEARCHING FOR MATCHING EXPORT"
          Write-Host "======================================================"

          Write-Host ""
          Write-Host "Requested Source:"
          Write-Host $env:SOURCE_ENVIRONMENT

          Write-Host ""
          Write-Host "Requested Solution:"
          Write-Host $env:SOLUTION_NAME


          $headers = @{

              Authorization = "Bearer $env:GH_TOKEN"

              Accept = "application/vnd.github+json"

              "X-GitHub-Api-Version" = "2022-11-28"
          }


          $runsUrl =
            "https://api.github.com/repos/$env:REPOSITORY/actions/workflows/export-solution.yml/runs?status=success&per_page=100"


          Write-Host ""
          Write-Host "Querying:"
          Write-Host $runsUrl


          try {

              $response =
                Invoke-RestMethod `
                  -Uri $runsUrl `
                  -Headers $headers `
                  -Method Get

          }
          catch {

              Write-Error "Unable to query GitHub Export workflow."
              Write-Error $_
              exit 1
          }


          if ($null -eq $response.workflow_runs) {

              Write-Error "GitHub returned no workflow runs."
              exit 1
          }


          $successfulRuns =
            @(
                $response.workflow_runs |
                Where-Object {
                    $_.conclusion -eq "success"
                }
            )


          if ($successfulRuns.Count -eq 0) {

              Write-Error ""
              Write-Error "======================================================"
              Write-Error "NO SUCCESSFUL EXPORT FOUND"
              Write-Error "======================================================"

              exit 1
          }


          $successfulRuns =
            $successfulRuns |
            Sort-Object created_at -Descending


          $matchingRun = $null
          $matchingArtifact = $null


          foreach ($run in $successfulRuns) {

              Write-Host ""
              Write-Host "------------------------------------------------------"
              Write-Host "Checking Export Run:"
              Write-Host $run.run_number
              Write-Host "Created:"
              Write-Host $run.created_at
              Write-Host "------------------------------------------------------"


              $artifactsUrl =
                "https://api.github.com/repos/$env:REPOSITORY/actions/runs/$($run.id)/artifacts"


              try {

                  $artifactResponse =
                    Invoke-RestMethod `
                      -Uri $artifactsUrl `
                      -Headers $headers `
                      -Method Get

              }
              catch {

                  Write-Host ""
                  Write-Host "Unable to read artifacts for run:"
                  Write-Host $run.run_number

                  continue
              }


              $artifacts =
                @(
                    $artifactResponse.artifacts |
                    Where-Object {
                        $_.expired -eq $false
                    }
                )


              foreach ($artifact in $artifacts) {

                  Write-Host ""
                  Write-Host "Artifact:"
                  Write-Host $artifact.name


                  if (
                    $artifact.name -notlike
                    "powerplatform-solutions-*"
                  ) {

                      continue
                  }


                  $candidateDirectory =
                    "./candidate-artifact"


                  if (Test-Path $candidateDirectory) {

                      Remove-Item `
                        -Path $candidateDirectory `
                        -Recurse `
                        -Force
                  }


                  New-Item `
                    -ItemType Directory `
                    -Force `
                    -Path $candidateDirectory |
                    Out-Null


                  $candidateZip =
                    "$candidateDirectory/export.zip"


                  $artifactUrl =
                    "https://api.github.com/repos/$env:REPOSITORY/actions/artifacts/$($artifact.id)/zip"


                  try {

                      Invoke-WebRequest `
                        -Uri $artifactUrl `
                        -Headers $headers `
                        -OutFile $candidateZip

                  }
                  catch {

                      Write-Host ""
                      Write-Host "Unable to download artifact:"
                      Write-Host $artifact.name

                      continue
                  }


                  $candidateExtract =
                    "$candidateDirectory/extracted"


                  New-Item `
                    -ItemType Directory `
                    -Force `
                    -Path $candidateExtract |
                    Out-Null


                  try {

                      Expand-Archive `
                        -Path $candidateZip `
                        -DestinationPath $candidateExtract `
                        -Force

                  }
                  catch {

                      Write-Host ""
                      Write-Host "Unable to extract artifact:"
                      Write-Host $artifact.name

                      continue
                  }


                  $metadata =
                    Get-ChildItem `
                      -Path $candidateExtract `
                      -Filter "export-metadata.json" `
                      -Recurse `
                      -File |
                    Select-Object -First 1


                  if ($null -eq $metadata) {

                      Write-Host ""
                      Write-Host "No export-metadata.json found."

                      continue
                  }


                  try {

                      $metadataObject =
                        Get-Content `
                          $metadata.FullName `
                          -Raw |
                        ConvertFrom-Json

                  }
                  catch {

                      Write-Host ""
                      Write-Host "Invalid export metadata."

                      continue
                  }


                  Write-Host ""
                  Write-Host "Metadata Source:"
                  Write-Host $metadataObject.sourceEnvironment

                  Write-Host ""
                  Write-Host "Metadata Build:"
                  Write-Host $metadataObject.build


                  if (
                    $metadataObject.sourceEnvironment `
                    -ne `
                    $env:SOURCE_ENVIRONMENT
                  ) {

                      Write-Host ""
                      Write-Host "Source environment does not match."

                      continue
                  }


                  $solutionMatch = $false


                  foreach (
                    $exportedSolution
                    in $metadataObject.solutionNames
                  ) {

                      if (
                        $exportedSolution.Trim().ToLower() `
                        -eq `
                        $env:SOLUTION_NAME.Trim().ToLower()
                      ) {

                          $solutionMatch = $true
                          break
                      }
                  }


                  if (-not $solutionMatch) {

                      Write-Host ""
                      Write-Host "Solution does not exist in this export."

                      continue
                  }


                  $matchingRun =
                    $run

                  $matchingArtifact =
                    $artifact


                  Write-Host ""
                  Write-Host "======================================================"
                  Write-Host "MATCHING EXPORT FOUND"
                  Write-Host "======================================================"

                  Write-Host ""
                  Write-Host "Source:"
                  Write-Host $metadataObject.sourceEnvironment

                  Write-Host ""
                  Write-Host "Solution:"
                  Write-Host $env:SOLUTION_NAME

                  Write-Host ""
                  Write-Host "Build:"
                  Write-Host $metadataObject.build

                  Write-Host ""
                  Write-Host "Run Number:"
                  Write-Host $run.run_number

                  Write-Host ""
                  Write-Host "Artifact:"
                  Write-Host $artifact.name

                  Write-Host ""
                  Write-Host "======================================================"


                  break
              }


              if ($null -ne $matchingRun) {
                  break
              }
          }


          if ($null -eq $matchingRun) {

              Write-Error ""
              Write-Error "======================================================"
              Write-Error "NO MATCHING EXPORT FOUND"
              Write-Error "======================================================"

              Write-Error ""
              Write-Error "Source Environment:"
              Write-Error $env:SOURCE_ENVIRONMENT

              Write-Error ""
              Write-Error "Solution:"
              Write-Error $env:SOLUTION_NAME

              Write-Error ""
              Write-Error "Run the Export workflow first."

              exit 1
          }


          "EXPORT_RUN_ID=$($matchingRun.id)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


          "EXPORT_RUN_NUMBER=$($matchingRun.run_number)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


          "EXPORT_COMMIT=$($matchingRun.head_sha)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


          "ARTIFACT_ID=$($matchingArtifact.id)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


          "ARTIFACT_NAME=$($matchingArtifact.name)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


      # ============================================================
      # 8. DOWNLOAD SELECTED EXPORT ARTIFACT
      # ============================================================

      - name: Download Export Artifact
        shell: pwsh

        env:

          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}

        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "DOWNLOADING SELECTED EXPORT ARTIFACT"
          Write-Host "======================================================"

          Write-Host ""
          Write-Host "Artifact:"
          Write-Host $env:ARTIFACT_NAME


          New-Item `
            -ItemType Directory `
            -Force `
            -Path "./deployment-artifact" |
            Out-Null


          $artifactUrl =
            "https://api.github.com/repos/$env:REPOSITORY/actions/artifacts/$env:ARTIFACT_ID/zip"


          $headers = @{

              Authorization =
                "Bearer $env:GH_TOKEN"

              Accept =
                "application/vnd.github+json"

              "X-GitHub-Api-Version" =
                "2022-11-28"
          }


          $artifactZip =
            "./deployment-artifact/export-artifact.zip"


          try {

              Invoke-WebRequest `
                -Uri $artifactUrl `
                -Headers $headers `
                -OutFile $artifactZip

          }
          catch {

              Write-Error "Failed to download Export artifact."
              Write-Error $_
              exit 1
          }


          if (-not (Test-Path $artifactZip)) {

              Write-Error "Downloaded artifact ZIP was not found."
              exit 1
          }


          Write-Host ""
          Write-Host "Artifact downloaded successfully."


      # ============================================================
      # 9. EXTRACT ARTIFACT
      # ============================================================

      - name: Extract Export Artifact
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "EXTRACTING EXPORT ARTIFACT"
          Write-Host "======================================================"


          $extractPath =
            "./deployment-artifact/extracted"


          New-Item `
            -ItemType Directory `
            -Force `
            -Path $extractPath |
            Out-Null


          try {

              Expand-Archive `
                -Path "./deployment-artifact/export-artifact.zip" `
                -DestinationPath $extractPath `
                -Force

          }
          catch {

              Write-Error "Failed to extract deployment artifact."
              Write-Error $_
              exit 1
          }


          Write-Host ""
          Write-Host "Extracted artifact contents:"


          Get-ChildItem `
            -Path $extractPath `
            -Recurse |
            Select-Object FullName


      # ============================================================
      # 10. VERIFY ARTIFACT METADATA
      # ============================================================

      - name: Verify Artifact Metadata
        shell: pwsh

        env:

          SOURCE_ENVIRONMENT: ${{ inputs.sourceEnvironment }}
          SOLUTION_NAME: ${{ inputs.solutionName }}

        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "VERIFYING ARTIFACT"
          Write-Host "======================================================"


          $metadata =
            Get-ChildItem `
              -Path "./deployment-artifact/extracted" `
              -Filter "export-metadata.json" `
              -Recurse `
              -File |
            Select-Object -First 1


          if ($null -eq $metadata) {

              Write-Error "export-metadata.json was not found."
              exit 1
          }


          try {

              $metadataObject =
                Get-Content `
                  $metadata.FullName `
                  -Raw |
                ConvertFrom-Json

          }
          catch {

              Write-Error "Unable to read export-metadata.json."
              Write-Error $_
              exit 1
          }


          Write-Host ""
          Write-Host "Artifact Source:"
          Write-Host $metadataObject.sourceEnvironment


          Write-Host ""
          Write-Host "Requested Source:"
          Write-Host $env:SOURCE_ENVIRONMENT


          if (
            $metadataObject.sourceEnvironment `
            -ne `
            $env:SOURCE_ENVIRONMENT
          ) {

              Write-Error "Artifact source environment does not match."
              exit 1
          }


          $solutionFound = $false


          foreach (
            $solution
            in $metadataObject.solutionNames
          ) {

              if (
                $solution.Trim().ToLower() `
                -eq `
                $env:SOLUTION_NAME.Trim().ToLower()
              ) {

                  $solutionFound = $true
                  break
              }
          }


          if (-not $solutionFound) {

              Write-Error ""
              Write-Error "Requested solution was not found in artifact."

              Write-Error ""
              Write-Error "Requested:"
              Write-Error $env:SOLUTION_NAME

              exit 1
          }


          Write-Host ""
          Write-Host "Artifact verification successful."


      # ============================================================
      # 11. FIND SELECTED SOLUTION PACKAGE
      # ============================================================

      - name: Find Selected Solution Package
        shell: pwsh

        env:

          SOLUTION_NAME: ${{ inputs.solutionName }}
          DEPLOYMENT_TYPE: ${{ inputs.deploymentType }}

        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "FINDING SELECTED SOLUTION PACKAGE"
          Write-Host "======================================================"


          $root =
            "./deployment-artifact/extracted"


          if ($env:DEPLOYMENT_TYPE -eq "managed") {

              $pattern =
                "${env:SOLUTION_NAME}_managed.zip"

          }
          else {

              $pattern =
                "${env:SOLUTION_NAME}_unmanaged.zip"
          }


          Write-Host ""
          Write-Host "Expected package:"
          Write-Host $pattern


          $packages =
            @(
                Get-ChildItem `
                  -Path $root `
                  -Filter $pattern `
                  -Recurse `
                  -File
            )


          if ($packages.Count -eq 0) {

              Write-Error ""
              Write-Error "======================================================"
              Write-Error "SELECTED SOLUTION PACKAGE NOT FOUND"
              Write-Error "======================================================"

              Write-Error ""
              Write-Error "Solution:"
              Write-Error $env:SOLUTION_NAME

              Write-Error ""
              Write-Error "Deployment type:"
              Write-Error $env:DEPLOYMENT_TYPE

              exit 1
          }


          if ($packages.Count -gt 1) {

              Write-Error "Multiple packages matched the selected solution."

              foreach ($package in $packages) {
                  Write-Error $package.FullName
              }

              exit 1
          }


          $selectedPackage =
            $packages[0].FullName


          Write-Host ""
          Write-Host "Selected package:"
          Write-Host $selectedPackage


          "SOLUTION_PACKAGE=$selectedPackage" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


      # ============================================================
      # 12. DETECT SOLUTION COMPONENTS
      #
      # This is the important new step.
      #
      # The solution package is inspected before any optional
      # ATT/CCaaS-specific deployment operation is executed.
      # ============================================================

      - name: Detect Solution Components
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "DETECTING SOLUTION COMPONENTS"
          Write-Host "======================================================"


          $solutionPackage =
            $env:SOLUTION_PACKAGE


          if ([string]::IsNullOrWhiteSpace($solutionPackage)) {

              Write-Error "SOLUTION_PACKAGE is empty."
              exit 1
          }


          if (-not (Test-Path $solutionPackage)) {

              Write-Error "Solution package does not exist:"
              Write-Error $solutionPackage
              exit 1
          }


          $inspectionRoot =
            Join-Path `
              $env:RUNNER_TEMP `
              "att-solution-inspection"


          if (Test-Path $inspectionRoot) {

              Remove-Item `
                -Path $inspectionRoot `
                -Recurse `
                -Force
          }


          New-Item `
            -ItemType Directory `
            -Force `
            -Path $inspectionRoot |
            Out-Null


          Write-Host ""
          Write-Host "Inspecting:"
          Write-Host $solutionPackage


          try {

              Expand-Archive `
                -Path $solutionPackage `
                -DestinationPath $inspectionRoot `
                -Force

          }
          catch {

              Write-Error "Unable to inspect solution package."
              Write-Error $_
              exit 1
          }


          # ----------------------------------------------------------
          # Default flags
          # ----------------------------------------------------------

          $hasConnectionReferences = $false
          $hasCustomConnectors = $false
          $hasCopilot = $false
          $hasM2M = $false


          # ----------------------------------------------------------
          # Read solution XML if available
          # ----------------------------------------------------------

          $customizationsFiles =
            @(
                Get-ChildItem `
                  -Path $inspectionRoot `
                  -Filter "customizations.xml" `
                  -Recurse `
                  -File
            )


          $xmlText = ""


          foreach ($customizationsFile in $customizationsFiles) {

              try {

                  $xmlText +=
                    Get-Content `
                      $customizationsFile.FullName `
                      -Raw

              }
              catch {

                  Write-Host ""
                  Write-Host "Unable to read:"
                  Write-Host $customizationsFile.FullName
              }
          }


          $xmlLower =
            $xmlText.ToLowerInvariant()


          # ----------------------------------------------------------
          # Connection references
          #
          # Known Dataverse solution component type:
          # 3802 = Connection Reference
          # ----------------------------------------------------------

          if (
            $xmlLower -match
            'type\s*=\s*["'']3802["'']'
          ) {

              $hasConnectionReferences = $true
          }


          if (
            $xmlLower -match
            'connectionreference'
          ) {

              $hasConnectionReferences = $true
          }


          # ----------------------------------------------------------
          # Custom connectors
          #
          # Known solution component type:
          # 372 = Connector
          # ----------------------------------------------------------

          if (
            $xmlLower -match
            'type\s*=\s*["'']372["'']'
          ) {

              $hasCustomConnectors = $true
          }


          if (
            $xmlLower -match
            'customconnector'
          ) {

              $hasCustomConnectors = $true
          }


          if (
            $xmlLower -match
            'connector'
          ) {

              $connectorIndicators =
                @(
                    "connector",
                    "customconnector",
                    "connectionreference"
                )

              foreach ($indicator in $connectorIndicators) {

                  if ($xmlLower.Contains($indicator)) {

                      if ($indicator -eq "connector") {

                          # Avoid treating generic connection-reference
                          # text as a custom connector.
                          if (
                            $xmlLower -match
                            'customconnector'
                          ) {
                              $hasCustomConnectors = $true
                          }

                      }
                      else {

                          if ($indicator -eq "customconnector") {
                              $hasCustomConnectors = $true
                          }
                      }
                  }
              }
          }


          # ----------------------------------------------------------
          # Copilot / Bot detection
          #
          # We deliberately inspect the package instead of running:
          #
          #     pac copilot --help
          #
          # This prevents Copilot CLI errors for normal solutions.
          # ----------------------------------------------------------

          $copilotFilePatterns =
            @(
                "*bot*.json",
                "*bot*.xml",
                "*bot*.yaml",
                "*bot*.yml",
                "*copilot*.json",
                "*copilot*.xml",
                "*copilot*.yaml",
                "*copilot*.yml"
            )


          foreach ($pattern in $copilotFilePatterns) {

              $botFiles =
                @(
                    Get-ChildItem `
                      -Path $inspectionRoot `
                      -Recurse `
                      -File `
                      -Filter $pattern `
                      -ErrorAction SilentlyContinue
                )

              if ($botFiles.Count -gt 0) {

                  $hasCopilot = $true

                  break
              }
          }


          # Also inspect directory names commonly used by
          # Copilot Studio solution packages.

          $allDirectories =
            @(
                Get-ChildItem `
                  -Path $inspectionRoot `
                  -Recurse `
                  -Directory `
                  -ErrorAction SilentlyContinue
            )


          foreach ($directory in $allDirectories) {

              $directoryName =
                $directory.Name.ToLowerInvariant()

              if (
                $directoryName -eq "bots" -or
                $directoryName -eq "botcomponents" -or
                $directoryName -eq "copilot" -or
                $directoryName -eq "copilots"
              ) {

                  $hasCopilot = $true
                  break
              }
          }


          # ----------------------------------------------------------
          # M2M / chatbot relationship detection
          #
          # M2M logic is normally represented through relationship
          # components. We do not automatically treat every normal
          # Dataverse relationship as an ATT chatbot relationship.
          #
          # Existing ATT script is therefore only enabled when
          # obvious chatbot/bot indicators are present.
          # ----------------------------------------------------------

          if ($hasCopilot) {

              $hasM2M = $true
          }


          if (
            $xmlLower -match
            'manytomany'
          ) {

              # Do not automatically run ATT M2M repair for every
              # normal M2M Dataverse relationship.
              #
              # Only enable it when chatbot/bot indicators also exist.

              if ($hasCopilot) {
                  $hasM2M = $true
              }
          }


          # ----------------------------------------------------------
          # Display detection result
          # ----------------------------------------------------------

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "SOLUTION COMPONENT DETECTION"
          Write-Host "======================================================"


          Write-Host ""
          Write-Host "Connection References:"
          Write-Host $hasConnectionReferences


          Write-Host ""
          Write-Host "Custom Connectors:"
          Write-Host $hasCustomConnectors


          Write-Host ""
          Write-Host "Copilot / Agent:"
          Write-Host $hasCopilot


          Write-Host ""
          Write-Host "M2M / Chatbot Relationships:"
          Write-Host $hasM2M


          Write-Host ""
          Write-Host "======================================================"


          # ----------------------------------------------------------
          # Save flags for subsequent GitHub Actions steps
          # ----------------------------------------------------------

          "HAS_CONNECTION_REFERENCES=$($hasConnectionReferences.ToString().ToLower())" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


          "HAS_CUSTOM_CONNECTORS=$($hasCustomConnectors.ToString().ToLower())" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


          "HAS_COPILOT=$($hasCopilot.ToString().ToLower())" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


          "HAS_M2M=$($hasM2M.ToString().ToLower())" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


      # ============================================================
      # 13. DISPLAY DEPLOYMENT PLAN
      # ============================================================

      - name: Display Deployment Plan
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "DEPLOYMENT PLAN"
          Write-Host "======================================================"


          Write-Host ""
          Write-Host "Solution:"
          Write-Host "${{ inputs.solutionName }}"


          Write-Host ""
          Write-Host "Connection References:"
          Write-Host $env:HAS_CONNECTION_REFERENCES


          Write-Host ""
          Write-Host "Custom Connectors:"
          Write-Host $env:HAS_CUSTOM_CONNECTORS


          Write-Host ""
          Write-Host "M2M / Chatbot:"
          Write-Host $env:HAS_M2M


          Write-Host ""
          Write-Host "Copilot / Agent:"
          Write-Host $env:HAS_COPILOT


          Write-Host ""
          Write-Host "======================================================"
          Write-Host "OPTIONAL COMPONENT PLAN"
          Write-Host "======================================================"


          if ($env:HAS_CUSTOM_CONNECTORS -eq "true") {

              Write-Host "RUN  : Connector host patching."

          }
          else {

              Write-Host "SKIP : Connector host patching."
          }


          if ($env:HAS_CONNECTION_REFERENCES -eq "true") {

              Write-Host "RUN  : Connection reference resolution."

          }
          else {

              Write-Host "SKIP : Connection reference resolution."
          }


          if ($env:HAS_M2M -eq "true") {

              Write-Host "RUN  : M2M / chatbot relationship repair."

          }
          else {

              Write-Host "SKIP : M2M / chatbot relationship repair."
          }


          if ($env:HAS_COPILOT -eq "true") {

              Write-Host "RUN  : Copilot publishing."

          }
          else {

              Write-Host "SKIP : Copilot publishing."
          }


          Write-Host ""
          Write-Host "======================================================"


      # ============================================================
      # 14. LOAD DEPLOYMENT SETTINGS
      # ============================================================

      - name: Load Deployment Settings
        shell: pwsh

        env:

          TARGET_ENVIRONMENT: ${{ inputs.targetEnvironment }}

        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "DEPLOYMENT SETTINGS"
          Write-Host "======================================================"


          $settingsDirectory =
            "./Deployment Settings"


          $settingsFile =
            "$settingsDirectory/ATT-$($env:TARGET_ENVIRONMENT).json"


          Write-Host ""
          Write-Host "Target:"
          Write-Host $env:TARGET_ENVIRONMENT


          Write-Host ""
          Write-Host "Expected settings file:"
          Write-Host $settingsFile


          if (Test-Path $settingsFile) {

              Write-Host ""
              Write-Host "Deployment settings found:"
              Write-Host $settingsFile


              "DEPLOYMENT_SETTINGS_FILE=$settingsFile" |
                Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

          }
          else {

              Write-Host ""
              Write-Host "Deployment settings file was not found."


              "DEPLOYMENT_SETTINGS_FILE=" |
                Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

              Write-Host ""
              Write-Host "Continuing without deployment settings."
          }


      # ============================================================
      # 15. PATCH CONNECTOR HOSTS
      # ============================================================

      - name: Patch Connector Hosts
        if: env.HAS_CUSTOM_CONNECTORS == 'true'
        shell: pwsh

        env:

          TARGET_ENVIRONMENT: ${{ inputs.targetEnvironment }}

        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "PATCH CONNECTOR HOSTS"
          Write-Host "======================================================"


          Write-Host "Custom connector detected."
          Write-Host "Connector host patching is required."


          $script =
            "./PowershellScripts/patch-connector-host.ps1"


          if (-not (Test-Path $script)) {

              Write-Error ""
              Write-Error "Custom connector detected but patch script was not found:"
              Write-Error $script

              exit 1
          }


          & $script `
            -Environment $env:TARGET_ENVIRONMENT


          if ($LASTEXITCODE -ne 0) {

              Write-Error "Connector host patching failed."
              exit 1
          }


          Write-Host ""
          Write-Host "Connector host patching completed successfully."


      # ============================================================
      # 16. RESOLVE CONNECTION REFERENCES
      # ============================================================

      - name: Resolve Connection References
        if: env.HAS_CONNECTION_REFERENCES == 'true'
        shell: pwsh

        env:

          TARGET_ENVIRONMENT: ${{ inputs.targetEnvironment }}

        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "RESOLVE CONNECTION REFERENCES"
          Write-Host "======================================================"


          Write-Host "Connection references detected."
          Write-Host "Connection reference resolution is required."


          $script =
            "./PowershellScripts/resolve-connrefs.ps1"


          if (-not (Test-Path $script)) {

              Write-Error ""
              Write-Error "Connection references detected but script was not found:"
              Write-Error $script

              exit 1
          }


          & $script `
            -Environment $env:TARGET_ENVIRONMENT


          if ($LASTEXITCODE -ne 0) {

              Write-Error "Connection reference resolution failed."
              exit 1
          }


          Write-Host ""
          Write-Host "Connection reference resolution completed successfully."


      # ============================================================
      # 17. AUTHENTICATE TO TARGET ENVIRONMENT
      # ============================================================

      - name: Authenticate To Target Environment
        shell: pwsh

        env:

          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          TENANT_ID: ${{ secrets.TENANT_ID }}

          CCAASTRAIL_URL: ${{ secrets.CCAASTRAIL_URL }}
          DEV_URL: ${{ secrets.DEV_URL }}
          UAT_URL: ${{ secrets.UAT_URL }}
          PROD_URL: ${{ secrets.PROD_URL }}

          TARGET_ENVIRONMENT: ${{ inputs.targetEnvironment }}

        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "AUTHENTICATING TO TARGET ENVIRONMENT"
          Write-Host "======================================================"


          if ([string]::IsNullOrWhiteSpace($env:CLIENT_ID)) {

              Write-Error "CLIENT_ID repository secret is missing."
              exit 1
          }


          if ([string]::IsNullOrWhiteSpace($env:CLIENT_SECRET)) {

              Write-Error "CLIENT_SECRET repository secret is missing."
              exit 1
          }


          if ([string]::IsNullOrWhiteSpace($env:TENANT_ID)) {

              Write-Error "TENANT_ID repository secret is missing."
              exit 1
          }


          $targetUrl = $null


          switch ($env:TARGET_ENVIRONMENT) {

              "CCaaS" {

                  $targetUrl =
                    $env:CCAASTRAIL_URL
              }

              "DEV" {

                  $targetUrl =
                    $env:DEV_URL
              }

              "UAT" {

                  $targetUrl =
                    $env:UAT_URL
              }

              "PROD" {

                  $targetUrl =
                    $env:PROD_URL
              }

              default {

                  Write-Error `
                    "Unsupported target environment: $env:TARGET_ENVIRONMENT"

                  exit 1
              }
          }


          if ([string]::IsNullOrWhiteSpace($targetUrl)) {

              Write-Error ""
              Write-Error "======================================================"
              Write-Error "TARGET ENVIRONMENT URL IS MISSING"
              Write-Error "======================================================"


              switch ($env:TARGET_ENVIRONMENT) {

                  "CCaaS" {
                      Write-Error "Required repository secret: CCAASTRAIL_URL"
                  }

                  "DEV" {
                      Write-Error "Required repository secret: DEV_URL"
                  }

                  "UAT" {
                      Write-Error "Required repository secret: UAT_URL"
                  }

                  "PROD" {
                      Write-Error "Required repository secret: PROD_URL"
                  }
              }

              exit 1
          }


          Write-Host ""
          Write-Host "Target environment:"
          Write-Host $env:TARGET_ENVIRONMENT


          Write-Host ""
          Write-Host "Target URL:"
          Write-Host $targetUrl


          pac auth create `
            --applicationId "$env:CLIENT_ID" `
            --clientSecret "$env:CLIENT_SECRET" `
            --tenant "$env:TENANT_ID" `
            --environment "$targetUrl"


          if ($LASTEXITCODE -ne 0) {

              Write-Error ""
              Write-Error "Target environment authentication failed."
              exit 1
          }


          "TARGET_ENVIRONMENT_URL=$targetUrl" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


          Write-Host ""
          Write-Host "Target authentication successful."


      # ============================================================
      # 18. VERIFY TARGET AUTHENTICATION
      # ============================================================

      - name: Verify Target Authentication
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "VERIFYING TARGET AUTHENTICATION"
          Write-Host "======================================================"


          pac auth list


          if ($LASTEXITCODE -ne 0) {

              Write-Error "PAC authentication verification failed."
              exit 1
          }


          Write-Host ""
          Write-Host "Target authentication verified."


      # ============================================================
      # 19. IMPORT SELECTED SOLUTION
      # ============================================================

      - name: Import Selected Solution
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "IMPORTING SELECTED SOLUTION"
          Write-Host "======================================================"


          if (
            [string]::IsNullOrWhiteSpace(
              $env:SOLUTION_PACKAGE
            )
          ) {

              Write-Error "Solution package path was not found."
              exit 1
          }


          if (-not (Test-Path $env:SOLUTION_PACKAGE)) {

              Write-Error ""
              Write-Error "Solution package does not exist."
              Write-Error $env:SOLUTION_PACKAGE

              exit 1
          }


          Write-Host ""
          Write-Host "Solution:"
          Write-Host "${{ inputs.solutionName }}"


          Write-Host ""
          Write-Host "Package:"
          Write-Host $env:SOLUTION_PACKAGE


          Write-Host ""
          Write-Host "Deployment Type:"
          Write-Host "${{ inputs.deploymentType }}"


          Write-Host ""
          Write-Host "Target:"
          Write-Host "${{ inputs.targetEnvironment }}"


          pac solution import `
            --path "$env:SOLUTION_PACKAGE" `
            --force-overwrite


          if ($LASTEXITCODE -ne 0) {

              Write-Error ""
              Write-Error "Solution import failed."
              Write-Error $env:SOLUTION_PACKAGE

              exit 1
          }


          Write-Host ""
          Write-Host "======================================================"
          Write-Host "SOLUTION IMPORT SUCCESSFUL"
          Write-Host "======================================================"


      # ============================================================
      # 20. PUBLISH CUSTOMIZATIONS
      # ============================================================

      - name: Publish Customizations
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "PUBLISHING CUSTOMIZATIONS"
          Write-Host "======================================================"


          pac solution publish


          if ($LASTEXITCODE -ne 0) {

              Write-Error "Publishing customizations failed."
              exit 1
          }


          Write-Host ""
          Write-Host "Customizations published successfully."


      # ============================================================
      # 21. VERIFY PUBLISH
      # ============================================================

      - name: Verify Publish
        shell: pwsh

        env:

          TARGET_ENVIRONMENT: ${{ inputs.targetEnvironment }}

        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "VERIFY PUBLISH"
          Write-Host "======================================================"


          $script =
            "./PowershellScripts/verify-publish.ps1"


          if (Test-Path $script) {

              Write-Host "Running:"
              Write-Host $script


              & $script `
                -Environment $env:TARGET_ENVIRONMENT


              if ($LASTEXITCODE -ne 0) {

                  Write-Error "Publish verification failed."
                  exit 1
              }


              Write-Host ""
              Write-Host "Publish verification completed."

          }
          else {

              Write-Host ""
              Write-Host "verify-publish.ps1 not found."
              Write-Host "Skipping custom verification."
          }


      # ============================================================
      # 22. FIX M2M / CHATBOT RELATIONSHIPS
      # ============================================================

      - name: Fix M2M Links
        if: env.HAS_M2M == 'true'
        shell: pwsh

        env:

          TARGET_ENVIRONMENT: ${{ inputs.targetEnvironment }}

        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "FIXING CHATBOT / M2M RELATIONSHIPS"
          Write-Host "======================================================"


          Write-Host "M2M / chatbot components detected."
          Write-Host "Running ATT relationship repair."


          $script =
            "./PowershellScripts/fix-m2m-links.ps1"


          if (-not (Test-Path $script)) {

              Write-Error ""
              Write-Error "M2M components detected but repair script was not found:"
              Write-Error $script

              exit 1
          }


          & $script `
            -Environment $env:TARGET_ENVIRONMENT


          if ($LASTEXITCODE -ne 0) {

              Write-Error "M2M relationship fix failed."
              exit 1
          }


          Write-Host ""
          Write-Host "M2M relationship repair completed successfully."


      # ============================================================
      # 23. PUBLISH COPILOT BOTS
      #
      # IMPORTANT:
      # No "pac copilot --help" is executed.
      #
      # This step runs ONLY when Copilot/Bot components were detected.
      # ============================================================

      - name: Publish Copilot Bots
        if: env.HAS_COPILOT == 'true'
        shell: pwsh

        env:

          TARGET_ENVIRONMENT: ${{ inputs.targetEnvironment }}

        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "COPILOT / AGENT DETECTED"
          Write-Host "======================================================"


          Write-Host ""
          Write-Host "Copilot/Agent components were detected."
          Write-Host "Running Copilot publishing."


          $script =
            "./PowershellScripts/publish-bot.ps1"


          if (-not (Test-Path $script)) {

              Write-Error ""
              Write-Error "Copilot components detected but publish-bot.ps1 was not found:"
              Write-Error $script

              exit 1
          }


          & $script `
            -Environment $env:TARGET_ENVIRONMENT


          if ($LASTEXITCODE -ne 0) {

              Write-Error "Copilot bot publishing failed."
              exit 1
          }


          Write-Host ""
          Write-Host "Copilot publishing completed successfully."


      # ============================================================
      # 24. OPTIONAL COMPONENT SUMMARY
      # ============================================================

      - name: Optional Component Summary
        if: success()
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "OPTIONAL COMPONENT DEPLOYMENT SUMMARY"
          Write-Host "======================================================"


          if ($env:HAS_CUSTOM_CONNECTORS -eq "true") {

              Write-Host "Custom Connectors : PROCESSED"

          }
          else {

              Write-Host "Custom Connectors : SKIPPED"
          }


          if ($env:HAS_CONNECTION_REFERENCES -eq "true") {

              Write-Host "Connection Refs   : PROCESSED"

          }
          else {

              Write-Host "Connection Refs   : SKIPPED"
          }


          if ($env:HAS_M2M -eq "true") {

              Write-Host "M2M / Chatbot     : PROCESSED"

          }
          else {

              Write-Host "M2M / Chatbot     : SKIPPED"
          }


          if ($env:HAS_COPILOT -eq "true") {

              Write-Host "Copilot / Agent   : PROCESSED"

          }
          else {

              Write-Host "Copilot / Agent   : SKIPPED"
          }


          Write-Host ""
          Write-Host "======================================================"


      # ============================================================
      # 25. DEPLOYMENT SUMMARY
      # ============================================================

      - name: Deployment Summary
        if: success()
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host ""
          Write-Host "======================================================"
          Write-Host "ATT DEPLOYMENT SUCCESSFUL"
          Write-Host "======================================================"


          Write-Host ""
          Write-Host "Source Environment:"
          Write-Host "${{ inputs.sourceEnvironment }}"


          Write-Host ""
          Write-Host "Solution:"
          Write-Host "${{ inputs.solutionName }}"


          Write-Host ""
          Write-Host "Export Run:"
          Write-Host $env:EXPORT_RUN_NUMBER


          Write-Host ""
          Write-Host "Export Run ID:"
          Write-Host $env:EXPORT_RUN_ID


          Write-Host ""
          Write-Host "Artifact:"
          Write-Host $env:ARTIFACT_NAME


          Write-Host ""
          Write-Host "Deployment Type:"
          Write-Host "${{ inputs.deploymentType }}"


          Write-Host ""
          Write-Host "Target Environment:"
          Write-Host "${{ inputs.targetEnvironment }}"


          Write-Host ""
          Write-Host "Target URL:"
          Write-Host $env:TARGET_ENVIRONMENT_URL


          Write-Host ""
          Write-Host "======================================================"
          Write-Host "COMPONENT PROCESSING"
          Write-Host "======================================================"


          Write-Host ""
          Write-Host "Connection References:"
          Write-Host $env:HAS_CONNECTION_REFERENCES


          Write-Host ""
          Write-Host "Custom Connectors:"
          Write-Host $env:HAS_CUSTOM_CONNECTORS


          Write-Host ""
          Write-Host "M2M / Chatbot:"
          Write-Host $env:HAS_M2M


          Write-Host ""
          Write-Host "Copilot / Agent:"
          Write-Host $env:HAS_COPILOT


          Write-Host ""
          Write-Host "======================================================"
          Write-Host "SOURCE → EXPORT → ARTIFACT → TARGET"
          Write-Host "======================================================"


      # ============================================================
      # 26. FAILURE DIAGNOSTICS
      # ============================================================

      - name: Diagnose Deployment Failure
        if: failure()
        shell: pwsh

        env:

          TARGET_ENVIRONMENT: ${{ inputs.targetEnvironment }}

        run: |

          Write-Host ""
          Write-Host "======================================================"
          Write-Host "ATT DEPLOYMENT FAILED"
          Write-Host "======================================================"


          Write-Host ""
          Write-Host "Source Environment:"
          Write-Host "${{ inputs.sourceEnvironment }}"


          Write-Host ""
          Write-Host "Solution:"
          Write-Host "${{ inputs.solutionName }}"


          Write-Host ""
          Write-Host "Target Environment:"
          Write-Host "${{ inputs.targetEnvironment }}"


          Write-Host ""
          Write-Host "Deployment Type:"
          Write-Host "${{ inputs.deploymentType }}"


          Write-Host ""
          Write-Host "Export Run:"
          Write-Host "$env:EXPORT_RUN_NUMBER"


          Write-Host ""
          Write-Host "Export Run ID:"
          Write-Host "$env:EXPORT_RUN_ID"


          Write-Host ""
          Write-Host "Artifact:"
          Write-Host "$env:ARTIFACT_NAME"


          Write-Host ""
          Write-Host "Detected Components:"
          Write-Host "Connection References: $env:HAS_CONNECTION_REFERENCES"
          Write-Host "Custom Connectors: $env:HAS_CUSTOM_CONNECTORS"
          Write-Host "M2M / Chatbot: $env:HAS_M2M"
          Write-Host "Copilot / Agent: $env:HAS_COPILOT"


          $script =
            "./PowershellScripts/diagnose-failure.ps1"


          if (Test-Path $script) {

              Write-Host ""
              Write-Host "Running failure diagnostics:"
              Write-Host $script


              & $script `
                -Environment $env:TARGET_ENVIRONMENT

          }
          else {

              Write-Host ""
              Write-Host "diagnose-failure.ps1 not found."
              Write-Host "No custom ATT diagnostics are available."
          }
