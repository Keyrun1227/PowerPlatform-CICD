name: ATT Export Solution

on:
  workflow_dispatch:
    inputs:

      solutionNames:
        description: "Enter solution name(s), comma separated"
        required: true
        type: string

      updateVersion:
        description: "Update Power Platform solution version?"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: att-export-main
  cancel-in-progress: false


jobs:

  export-solution:

    runs-on: windows-latest

    steps:

      # ============================================================
      # 1. CHECKOUT REPOSITORY
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0


      # ============================================================
      # 2. DISPLAY INPUTS
      # ============================================================

      - name: Display Pipeline Inputs
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "ATT POWER PLATFORM EXPORT PIPELINE"
          Write-Host "============================================================"
          Write-Host "Solutions:"
          Write-Host "${{ inputs.solutionNames }}"
          Write-Host ""
          Write-Host "Update Version:"
          Write-Host "${{ inputs.updateVersion }}"
          Write-Host "============================================================"


      # ============================================================
      # 3. INSTALL .NET
      # ============================================================

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"


      # ============================================================
      # 4. INSTALL POWER PLATFORM CLI
      # ============================================================

      - name: Install Power Platform CLI
        shell: pwsh
        run: |
          Write-Host "Installing Power Platform CLI..."

          dotnet tool install --global Microsoft.PowerApps.CLI.Tool

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Power Platform CLI installation failed."
              exit 1
          }


      # ============================================================
      # 5. ADD PAC TO PATH
      # ============================================================

      - name: Add PAC To PATH
        shell: pwsh
        run: |
          $pacPath = "$env:USERPROFILE\.dotnet\tools"

          Write-Host "PAC path:"
          Write-Host $pacPath

          $pacPath | Out-File `
            -FilePath $env:GITHUB_PATH `
            -Encoding utf8 `
            -Append


      # ============================================================
      # 6. VERIFY PAC
      # ============================================================

      - name: Verify PAC Installation
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "VERIFYING PAC CLI"
          Write-Host "============================================================"

          pac help

          if ($LASTEXITCODE -ne 0) {
              Write-Error "PAC CLI verification failed."
              exit 1
          }


      # ============================================================
      # 7. READ AND INCREMENT BUILD NUMBER
      # ============================================================

      - name: Read And Increment Build Number
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "BUILD NUMBER MANAGEMENT"
          Write-Host "============================================================"

          $buildFile = "./build.txt"

          if (-not (Test-Path $buildFile)) {

              Write-Host "build.txt does not exist."
              Write-Host "Starting with Build100."

              $currentBuild = 100
          }
          else {

              $content = (Get-Content $buildFile -Raw).Trim()

              Write-Host "Current build:"
              Write-Host $content

              if ($content -match "^Build(\d+)$") {

                  $currentBuild = [int]$Matches[1]

              }
              else {

                  Write-Error "Invalid build.txt format."
                  Write-Error "Expected format: Build100"

                  exit 1
              }
          }

          $newBuildNumber = $currentBuild + 1

          $buildVersion = "Build$newBuildNumber"

          Set-Content `
            -Path $buildFile `
            -Value $buildVersion `
            -Encoding utf8

          Write-Host ""
          Write-Host "Previous Build : Build$currentBuild"
          Write-Host "New Build      : $buildVersion"

          "BUILD_VERSION=$buildVersion" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append


      # ============================================================
      # 8. AUTHENTICATE TO DEV
      # ============================================================

      - name: Authenticate To DEV
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "AUTHENTICATING TO DEV"
          Write-Host "============================================================"

          pac auth create `
            --applicationId "${{ secrets.CLIENT_ID }}" `
            --clientSecret "${{ secrets.CLIENT_SECRET }}" `
            --tenant "${{ secrets.TENANT_ID }}" `
            --environment "${{ secrets.DEV_URL }}"

          if ($LASTEXITCODE -ne 0) {

              Write-Error "DEV authentication failed."

              exit 1
          }


      # ============================================================
      # 9. VERIFY DEV AUTHENTICATION
      # ============================================================

      - name: Verify DEV Authentication
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "PAC AUTHENTICATION"
          Write-Host "============================================================"

          pac auth list


      # ============================================================
      # 10. PREPARE REPOSITORY DIRECTORIES
      # ============================================================

      - name: Prepare Repository Directories
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "Preparing repository directories..."

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "./src/solutions" |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "./deployments/$env:BUILD_VERSION" |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "./checker-results/$env:BUILD_VERSION" |
            Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "./temp/$env:BUILD_VERSION" |
            Out-Null


      # ============================================================
      # 11. EXPORT / CHECK / UNPACK / PACK
      # ============================================================

      - name: Process Selected Solutions
        shell: pwsh
        env:
          SOLUTION_NAMES: ${{ inputs.solutionNames }}
          UPDATE_VERSION: ${{ inputs.updateVersion }}
        run: |

          $solutions = $env:SOLUTION_NAMES -split ','

          foreach ($solution in $solutions) {

              $solution = $solution.Trim()

              if ([string]::IsNullOrWhiteSpace($solution)) {
                  continue
              }

              Write-Host ""
              Write-Host ""
              Write-Host "############################################################"
              Write-Host "PROCESSING SOLUTION"
              Write-Host "Solution : $solution"
              Write-Host "Build    : $env:BUILD_VERSION"
              Write-Host "############################################################"


              # ======================================================
              # SOLUTION PATHS
              # ======================================================

              $sourcePath =
                "./src/solutions/$solution"

              $buildPath =
                "./temp/$env:BUILD_VERSION/$solution"

              $managedPath =
                "./deployments/$env:BUILD_VERSION/${solution}_managed.zip"

              $unmanagedPath =
                "./deployments/$env:BUILD_VERSION/${solution}_unmanaged.zip"

              $checkerPath =
                "./checker-results/$env:BUILD_VERSION/$solution"


              New-Item `
                -ItemType Directory `
                -Force `
                -Path $buildPath |
                Out-Null

              New-Item `
                -ItemType Directory `
                -Force `
                -Path $checkerPath |
                Out-Null


              # ======================================================
              # 12. READ CURRENT SOLUTION VERSION
              # ======================================================

              Write-Host ""
              Write-Host "Reading current solution version..."

              $versionOutput = pac solution online-version `
                --solution-name "$solution"

              if ($LASTEXITCODE -ne 0) {

                  Write-Error `
                    "Unable to read current version for $solution."

                  exit 1
              }

              Write-Host "PAC version response:"
              Write-Host $versionOutput


              # ======================================================
              # 13. PARSE VERSION
              # ======================================================

              $versionText = ($versionOutput | Out-String).Trim()

              $versionMatch = `
                [regex]::Match(
                    $versionText,
                    "\d+\.\d+\.\d+\.\d+"
                )

              if (-not $versionMatch.Success) {

                  Write-Error `
                    "Could not determine solution version for $solution."

                  exit 1
              }

              $currentVersion = $versionMatch.Value

              Write-Host ""
              Write-Host "Current Version:"
              Write-Host $currentVersion


              # ======================================================
              # 14. OPTIONAL SOLUTION VERSION UPDATE
              # ======================================================

              if ($env:UPDATE_VERSION -eq "true") {

                  Write-Host ""
                  Write-Host "Updating solution version..."

                  $parts = $currentVersion.Split(".")

                  $major =
                    [int]$parts[0]

                  $minor =
                    [int]$parts[1]

                  $build =
                    [int]$parts[2]

                  $revision =
                    [int]$parts[3]

                  $newRevision =
                    $revision + 1

                  $newVersion =
                    "$major.$minor.$build.$newRevision"

                  Write-Host ""
                  Write-Host "Old Version : $currentVersion"
                  Write-Host "New Version : $newVersion"

                  pac solution online-version `
                    --solution-name "$solution" `
                    --solution-version "$newVersion"

                  if ($LASTEXITCODE -ne 0) {

                      Write-Error `
                        "Failed to update version for $solution."

                      exit 1
                  }

                  Write-Host "Version updated successfully."

              }
              else {

                  Write-Host ""
                  Write-Host "Version update disabled."

                  $newVersion =
                    $currentVersion
              }


              # ======================================================
              # 15. EXPORT UNMANAGED SOLUTION
              # ======================================================

              Write-Host ""
              Write-Host "Exporting UNMANAGED solution..."

              pac solution export `
                --name "$solution" `
                --path "$unmanagedPath"

              if ($LASTEXITCODE -ne 0) {

                  Write-Error `
                    "Unmanaged export failed for $solution."

                  exit 1
              }

              Write-Host "Unmanaged export completed."


              # ======================================================
              # 16. EXPORT MANAGED SOLUTION
              # ======================================================

              Write-Host ""
              Write-Host "Exporting MANAGED solution..."

              pac solution export `
                --name "$solution" `
                --path "$managedPath" `
                --managed

              if ($LASTEXITCODE -ne 0) {

                  Write-Error `
                    "Managed export failed for $solution."

                  exit 1
              }

              Write-Host "Managed export completed."


              # ======================================================
              # 17. SOLUTION CHECKER
              # ======================================================

              Write-Host ""
              Write-Host "Running Power Platform Solution Checker..."

              pac solution check `
                --path "$unmanagedPath" `
                --outputDirectory "$checkerPath"

              if ($LASTEXITCODE -ne 0) {

                  Write-Error `
                    "Solution Checker failed for $solution."

                  exit 1
              }

              Write-Host "Solution Checker completed."


              # ======================================================
              # 18. REMOVE OLD SOURCE
              # ======================================================

              if (Test-Path $sourcePath) {

                  Write-Host ""
                  Write-Host "Removing previous unpacked source..."

                  Remove-Item `
                    -Path $sourcePath `
                    -Recurse `
                    -Force
              }


              # ======================================================
              # 19. UNPACK UNMANAGED SOLUTION
              # ======================================================

              Write-Host ""
              Write-Host "Unpacking UNMANAGED solution..."

              New-Item `
                -ItemType Directory `
                -Force `
                -Path $sourcePath |
                Out-Null

              pac solution unpack `
                --zipfile "$unmanagedPath" `
                --folder "$sourcePath"

              if ($LASTEXITCODE -ne 0) {

                  Write-Error `
                    "Solution unpack failed for $solution."

                  exit 1
              }

              Write-Host "Solution unpack completed."


              # ======================================================
              # 20. SAVE BUILD INFORMATION
              # ======================================================

              $versionInfo = @"
                Solution Name : $solution
                Build         : $env:BUILD_VERSION
                Version       : $newVersion
                Managed ZIP   : ${solution}_managed.zip
                Unmanaged ZIP : ${solution}_unmanaged.zip
                "@

              Set-Content `
                -Path "$sourcePath/build-info.txt" `
                -Value $versionInfo `
                -Encoding utf8


              # ======================================================
              # 21. PACK SOURCE FOR VALIDATION
              # ======================================================

              $validationZip =
                "$buildPath/${solution}_validation.zip"

              Write-Host ""
              Write-Host "Packing source for validation..."

              pac solution pack `
                --folder "$sourcePath" `
                --zipfile "$validationZip" `
                --packagetype Unmanaged

              if ($LASTEXITCODE -ne 0) {

                  Write-Error `
                    "Solution pack failed for $solution."

                  exit 1
              }

              Write-Host "Validation package created."


              # ======================================================
              # 22. DISPLAY SOLUTION RESULTS
              # ======================================================

              Write-Host ""
              Write-Host "============================================================"
              Write-Host "SOLUTION COMPLETED"
              Write-Host "============================================================"

              Write-Host "Solution:"
              Write-Host $solution

              Write-Host ""
              Write-Host "Version:"
              Write-Host $newVersion

              Write-Host ""
              Write-Host "Managed ZIP:"
              Write-Host $managedPath

              Write-Host ""
              Write-Host "Unmanaged ZIP:"
              Write-Host $unmanagedPath

              Write-Host ""
              Write-Host "Source:"
              Write-Host $sourcePath

              Write-Host "============================================================"
          }


      # ============================================================
      # 23. DISPLAY GENERATED FILES
      # ============================================================

      - name: Display Generated Files
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "GENERATED FILES"
          Write-Host "============================================================"

          Get-ChildItem `
            -Path "./src" `
            -Recurse |
            Select-Object FullName

          Write-Host ""
          Write-Host "DEPLOYMENT PACKAGES"

          Get-ChildItem `
            -Path "./deployments" `
            -Recurse |
            Select-Object FullName

          Write-Host ""
          Write-Host "SOLUTION CHECKER RESULTS"

          Get-ChildItem `
            -Path "./checker-results" `
            -Recurse |
            Select-Object FullName


      # ============================================================
      # 24. COMMIT SOURCE + BUILD + ZIP FILES TO GITHUB
      # ============================================================

      - name: Commit Build To Repository
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "COMMITTING BUILD TO GITHUB"
          Write-Host "============================================================"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add build.txt
          git add src/
          git add deployments/
          git add checker-results/

          git status

          git diff --cached --quiet

          if ($LASTEXITCODE -eq 0) {

              Write-Host "No repository changes detected."

          }
          else {

              git commit `
                -m "ATT Export $env:BUILD_VERSION"

              if ($LASTEXITCODE -ne 0) {

                  Write-Error "Git commit failed."

                  exit 1
              }

              git push origin HEAD:main

              if ($LASTEXITCODE -ne 0) {

                  Write-Error "Git push failed."

                  exit 1
              }

              Write-Host ""
              Write-Host "Build committed successfully."
          }


      # ============================================================
      # 25. CREATE GITHUB ACTIONS ARTIFACT
      # ============================================================

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: powerplatform-solutions-${{ env.BUILD_VERSION }}
          path: |
            ./deployments/${{ env.BUILD_VERSION }}
            ./checker-results/${{ env.BUILD_VERSION }}
          if-no-files-found: error


      # ============================================================
      # 26. BUILD SUMMARY
      # ============================================================

      - name: Build Summary
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "ATT EXPORT PIPELINE COMPLETED"
          Write-Host "============================================================"

          Write-Host ""
          Write-Host "Build:"
          Write-Host $env:BUILD_VERSION

          Write-Host ""
          Write-Host "Solutions:"
          Write-Host "${{ inputs.solutionNames }}"

          Write-Host ""
          Write-Host "Update Version:"
          Write-Host "${{ inputs.updateVersion }}"

          Write-Host ""
          Write-Host "Repository:"
          Write-Host "Source + deployment ZIPs committed to GitHub"

          Write-Host ""
          Write-Host "GitHub Artifact:"
          Write-Host "powerplatform-solutions-$env:BUILD_VERSION"

          Write-Host ""
          Write-Host "============================================================"
