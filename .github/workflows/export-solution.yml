name: ATT Export Solution

on:
  workflow_dispatch:
    inputs:
      solutionNames:
        description: "Enter solution name(s), comma separated"
        required: true
        type: string

      updateVersion:
        description: "Update solution version?"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:

  export-solution:

    runs-on: windows-latest

    steps:

      # ==========================================
      # 1. CHECKOUT REPOSITORY
      # ==========================================

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true


      # ==========================================
      # 2. INSTALL .NET
      # ==========================================

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"


      # ==========================================
      # 3. INSTALL POWER PLATFORM CLI
      # ==========================================

      - name: Install Power Platform CLI
        shell: pwsh
        run: |
          dotnet tool install --global Microsoft.PowerApps.CLI.Tool


      # ==========================================
      # 4. ADD PAC TO PATH
      # ==========================================

      - name: Add PAC to PATH
        shell: pwsh
        run: |
          "$env:USERPROFILE\.dotnet\tools" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append


      # ==========================================
      # 5. VERIFY PAC INSTALLATION
      # ==========================================

      - name: Verify PAC Installation
        shell: pwsh
        run: |
          pac help


      # ==========================================
      # 6. READ AND INCREMENT BUILD NUMBER
      # ==========================================

      - name: Read and Increment Build Number
        shell: pwsh
        run: |

          if (-not (Test-Path "build.txt")) {
              Write-Error "build.txt was not found."
              exit 1
          }

          $currentBuild = (Get-Content "build.txt" -Raw).Trim()

          Write-Host "========================================="
          Write-Host "CURRENT BUILD"
          Write-Host "========================================="
          Write-Host "Current build: $currentBuild"

          if ($currentBuild -match "^Build(\d+)$") {

              $currentNumber = [int]$Matches[1]

              $newNumber = $currentNumber + 1

              $newBuild = "Build$newNumber"

              Write-Host "New build: $newBuild"

              Set-Content `
                -Path "build.txt" `
                -Value $newBuild `
                -NoNewline

              "BUILD_VERSION=$newBuild" |
                Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append

              "BUILD_NUMBER=$newNumber" |
                Out-File `
                  -FilePath $env:GITHUB_ENV `
                  -Encoding utf8 `
                  -Append
          }
          else {

              Write-Error "Invalid build.txt format."
              Write-Error "Expected format such as Build100."

              exit 1
          }


      # ==========================================
      # 7. VERIFY BUILD NUMBER
      # ==========================================

      - name: Verify Build Number
        shell: pwsh
        run: |

          $buildVersion = (Get-Content "build.txt" -Raw).Trim()

          Write-Host "========================================="
          Write-Host "BUILD INFORMATION"
          Write-Host "========================================="
          Write-Host "Build Version: $buildVersion"
          Write-Host "Build Number : $env:BUILD_NUMBER"


      # ==========================================
      # 8. COMMIT BUILD NUMBER TO REPOSITORY
      # ==========================================

      - name: Commit Updated Build Number
        shell: pwsh
        run: |

          $buildVersion = (Get-Content "build.txt" -Raw).Trim()

          Write-Host "========================================="
          Write-Host "COMMITTING BUILD NUMBER"
          Write-Host "========================================="
          Write-Host "Build Version: $buildVersion"

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add build.txt

          if (git diff --cached --quiet) {

              Write-Host "No changes detected in build.txt."

          }
          else {

              git commit `
                -m "Update build number to $buildVersion"

              git push origin HEAD:main

              Write-Host "Build number committed successfully."
          }


      # ==========================================
      # 9. AUTHENTICATE TO DEV
      # ==========================================

      - name: Authenticate to DEV
        shell: pwsh
        run: |

          Write-Host "Connecting to DEV..."

          pac auth create `
            --applicationId "${{ secrets.CLIENT_ID }}" `
            --clientSecret "${{ secrets.CLIENT_SECRET }}" `
            --tenant "${{ secrets.TENANT_ID }}" `
            --environment "${{ secrets.DEV_URL }}"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "DEV authentication failed."
              exit 1
          }

          Write-Host "DEV authentication successful."


      # ==========================================
      # 10. VERIFY AUTHENTICATION
      # ==========================================

      - name: Verify Authentication
        shell: pwsh
        run: |

          pac auth list


      # ==========================================
      # 11. CREATE OUTPUT FOLDERS
      # ==========================================

      - name: Create Output Folders
        shell: pwsh
        run: |

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "./output"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "./output/managed"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "./output/unmanaged"


      # ==========================================
      # 12. EXPORT MANAGED + UNMANAGED SOLUTIONS
      # ==========================================

      - name: Export Solutions
        shell: pwsh
        env:
          SOLUTION_NAMES: ${{ inputs.solutionNames }}

        run: |

          $solutions = $env:SOLUTION_NAMES -split ","

          if ($solutions.Count -eq 0) {
              Write-Error "No solutions were provided."
              exit 1
          }

          foreach ($solution in $solutions) {

              $solution = $solution.Trim()

              if ([string]::IsNullOrWhiteSpace($solution)) {
                  continue
              }

              Write-Host ""
              Write-Host "========================================="
              Write-Host "PROCESSING SOLUTION"
              Write-Host "========================================="
              Write-Host "Solution: $solution"
              Write-Host "Build   : $env:BUILD_VERSION"


              # ======================================
              # MANAGED EXPORT
              # ======================================

              Write-Host ""
              Write-Host "Exporting MANAGED solution..."

              pac solution export `
                --name "$solution" `
                --path "./output/managed/${solution}_managed.zip" `
                --managed

              if ($LASTEXITCODE -ne 0) {

                  Write-Error "Managed export failed for $solution."

                  exit 1
              }

              Write-Host "Managed export completed."


              # ======================================
              # UNMANAGED EXPORT
              # ======================================

              Write-Host ""
              Write-Host "Exporting UNMANAGED solution..."

              pac solution export `
                --name "$solution" `
                --path "./output/unmanaged/${solution}_unmanaged.zip"

              if ($LASTEXITCODE -ne 0) {

                  Write-Error "Unmanaged export failed for $solution."

                  exit 1
              }

              Write-Host "Unmanaged export completed."
          }


      # ==========================================
      # 13. DISPLAY EXPORTED FILES
      # ==========================================

      - name: Display Exported Solutions
        shell: pwsh
        run: |

          Write-Host ""
          Write-Host "========================================="
          Write-Host "EXPORTED SOLUTIONS"
          Write-Host "========================================="

          Get-ChildItem `
            -Path "./output" `
            -Recurse |
            Select-Object FullName, Length


      # ==========================================
      # 14. CREATE BUILD MANIFEST
      # ==========================================

      - name: Create Build Manifest
        shell: pwsh
        env:
          SOLUTION_NAMES: ${{ inputs.solutionNames }}

        run: |

          $buildVersion = (Get-Content "build.txt" -Raw).Trim()

          $manifest = @{
              BuildVersion = $buildVersion
              BuildNumber = $env:BUILD_NUMBER
              Solutions = $env:SOLUTION_NAMES
              SourceEnvironment = "DEV"
              CreatedAt = (Get-Date).ToUniversalTime().ToString("o")
          }

          $manifest |
            ConvertTo-Json -Depth 5 |
            Out-File `
              -FilePath "./output/build-manifest.json" `
              -Encoding utf8

          Write-Host "Build manifest created."

          Get-Content "./output/build-manifest.json"


      # ==========================================
      # 15. CREATE ARTIFACT
      # ==========================================

      - name: Upload Solution Artifact
        uses: actions/upload-artifact@v4
        with:
          name: powerplatform-solutions-${{ env.BUILD_VERSION }}
          path: ./output
          if-no-files-found: error
          retention-days: 30